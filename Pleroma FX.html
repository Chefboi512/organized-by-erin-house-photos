<style>
:root{
  /* Layout: a black-chrome plugin faceplate in a polished frame. Silver header rail, then the porthole pad (left) beside the selected node's control bay (right), and the modulation rail along the bottom. Single dark look by design. */
  --void:#030405;
  --plate:#0f1114;
  --bay:#060709;
  --ink:#e9ecef;
  --ink-2:#a7afb7;
  --ink-3:#626a72;
  --etch:#cfd4d9;
  --engrave:#1b1e21;
  --lcd-ink:#94e8ff;
  --led-off:#24282c;
  --pA:#ff3d6e;--pB:#e44cff;--pC:#9b5cff;--pD:#5277ff;--pE:#36c9ff;--pF:#4dffc3;
  --m1:#5ee9ff;--m2:#c79bff;--m3:#ffbf5a;--menv:#7dffb5;--mmac:#ff8fbf;
  --danger:#ff5a4f;
  --f-logo:"Michroma","Eurostile","Arial Black",sans-serif;
  --f-ui:"Saira Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--ink);height:100%}
body{margin:0;font-family:var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.page{
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(1200px 700px at 50% -10%,#11161b 0%,#07080a 55%,var(--void) 100%);
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;
}
.stage{position:relative;flex:none;width:1298px;height:838px;max-width:100%}
.rotate{display:none;font:600 11px/1.3 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-align:center}
@media (orientation:portrait) and (max-width:700px){.rotate{display:block}}

/* ---------- frame + chassis ---------- */
.frame{
  position:absolute;left:0;top:0;width:1298px;padding:9px;border-radius:26px;transform-origin:0 0;
  background:linear-gradient(150deg,#fbfcfd 0%,#9aa1a8 14%,#2c3035 30%,#d9dde1 46%,#5d6369 62%,#1d2024 78%,#c3c8cd 100%);
  box-shadow:0 0 0 1px #000,0 40px 90px rgba(0,0,0,.75),0 10px 24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.9);
}
.chassis{
  position:relative;width:1280px;height:820px;border-radius:18px;padding:12px;display:grid;gap:12px;grid-template-rows:84px minmax(0,1fr) 150px;
  /* textured powder-coat finish (assets/chassis.webp) under a soft top light */
  background-color:#141517;
  background-image:linear-gradient(180deg,rgba(255,255,255,.07) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,.3) 100%),var(--img-chassis,linear-gradient(180deg,#25282d 0%,#131518 16%,#0b0c0e 100%));
  background-size:100% 100%,cover;background-position:center;
  box-shadow:inset 0 0 0 1px #000,inset 0 2px 0 rgba(255,255,255,.12),inset 0 0 40px rgba(0,0,0,.6);
}
.screw{position:absolute;width:15px;height:15px;border-radius:50%;z-index:2;pointer-events:none;
  background:var(--screw,radial-gradient(circle at 38% 32%,#f2f4f5 0,#9aa1a7 38%,#4c5257 72%,#2a2d30 100%)) center/100% 100% no-repeat;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.8))}
.screw.tl{top:7px;left:7px}.screw.tr{top:7px;right:7px}.screw.bl{bottom:7px;left:7px}.screw.br{bottom:7px;right:7px}

/* ---------- silver header rail ---------- */
.top{
  position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:16px;
  padding:0 26px 0 30px;border-radius:11px;
  background-color:#c9ced2;
  background-image:var(--brushed,linear-gradient(transparent,transparent)),linear-gradient(180deg,#f4f6f7 0%,#d3d7da 44%,#b2b8bd 52%,#dfe2e5 100%);
  background-size:512px 512px,100% 100%;background-blend-mode:overlay,normal;
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.35),0 0 0 1px #000,0 3px 8px rgba(0,0,0,.6);
}
.mark{display:grid;gap:4px}
.mark h1{font:400 30px/1 var(--f-logo);letter-spacing:.06em;color:var(--engrave);
  text-shadow:0 1px 0 rgba(255,255,255,.85),0 -1px 0 rgba(0,0,0,.28)}
.mark p{font:600 9.5px/1 var(--f-ui);letter-spacing:.36em;color:#454b51;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,255,255,.7)}

.lcd{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:4px;min-width:0;
  height:58px;padding:0 8px;border-radius:7px;
  background:linear-gradient(180deg,#04070a,#0b1216);
  box-shadow:inset 0 3px 10px #000,inset 0 0 0 1px #000,0 1px 0 rgba(255,255,255,.75),0 -1px 0 rgba(0,0,0,.35);
}
.lcd-btn{all:unset;cursor:pointer;display:grid;place-items:center;width:30px;height:40px;border-radius:5px;color:#4f7d8c}
.lcd-btn:hover{color:var(--lcd-ink)}
.lcd-btn:focus-visible{outline:2px solid var(--lcd-ink)}
.lcd-btn svg{width:14px;height:14px}
.lcd-name{all:unset;cursor:pointer;min-width:0;display:grid;justify-items:center;text-align:center;gap:6px;padding:4px 10px;border-radius:5px}
.lcd-name:focus-visible{outline:2px solid var(--lcd-ink)}
.lcd-name b{max-width:100%;font:400 29px/1.05 var(--f-mono);letter-spacing:.2em;padding-left:.2em;text-transform:uppercase;color:var(--lcd-ink);text-shadow:0 0 9px rgba(148,232,255,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd-name span{max-width:100%;font:400 11.5px/1 var(--f-mono);color:rgba(255,255,255,.86);letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd-name b i{font-style:normal;color:#ffbf5a}

/* photographed steel die (assets/dice.webp) */
.cube{all:unset;cursor:pointer;width:48px;height:51px;display:block;position:relative;border-radius:10px;
  background:var(--img-dice) center/contain no-repeat;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.55)) drop-shadow(0 0 1px rgba(0,0,0,.6));transition:filter .15s}
.cube:hover{filter:drop-shadow(0 3px 4px rgba(0,0,0,.6)) drop-shadow(0 0 1px rgba(0,0,0,.6)) brightness(1.06)}
.cube:active{transform:translateY(1px) scale(.97);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)) brightness(.95)}
.cube:focus-visible{outline:2px solid var(--lcd-ink);outline-offset:3px}
.cube i{display:none}
.cube.spin{animation:spin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(180deg)}}
.tiny{font:600 9.5px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:#30353a;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.dice{display:grid;justify-items:center;gap:5px}

.bpm{all:unset;cursor:ns-resize;touch-action:none;display:grid;justify-items:center;gap:5px}
.bpm b{display:block;min-width:76px;text-align:center;padding:8px 8px;border-radius:6px;font:400 19px/1 var(--f-mono);color:var(--lcd-ink);
  background:linear-gradient(180deg,#04070a,#0b1216);box-shadow:inset 0 3px 8px #000,0 1px 0 rgba(255,255,255,.75);text-shadow:0 0 8px rgba(148,232,255,.4)}
.bpm:focus-visible b{outline:2px solid var(--lcd-ink)}
.top .tg-l{color:#30353a;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.top .kn-lab .l{color:#30353a;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.top .kr-tick{stroke:#2c3135;opacity:.7}
.top-r{display:flex;align-items:center;gap:18px}

/* ---------- main ---------- */
.main{position:relative;display:grid;grid-template-columns:548px minmax(0,1fr);gap:12px;min-height:0}
/* black panels: velvet (assets/velvet.webp) under a dark tint, so the nap shows without lifting the black */
.bay{position:relative;border-radius:13px;padding:16px;
  background:linear-gradient(180deg,rgba(11,12,15,.4),rgba(5,6,7,.62)),var(--img-velvet,linear-gradient(#0b0c0f,#050607)) center/cover,#08090b;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 12px 30px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.09),0 0 0 1px #000}

/* ---------- porthole ---------- */
.padbay{display:grid;place-items:center;padding:26px 20px 30px;min-height:0}
.port{position:relative;height:100%;aspect-ratio:1/1;max-width:100%}
.rim{position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle,transparent 0 61%,rgba(0,0,0,.55) 63.5%,transparent 66%),
    radial-gradient(120% 70% at 30% 8%,rgba(255,255,255,.55),transparent 42%),
    conic-gradient(from 200deg,#fdfefe 0deg,#8e959d 32deg,#24282d 78deg,#cfd4d8 122deg,#fbfcfc 150deg,#6c737a 196deg,#1c1f23 238deg,#b4bac0 284deg,#f3f5f6 318deg,#fdfefe 360deg);
  box-shadow:0 0 0 1px #000,0 10px 26px rgba(0,0,0,.8),inset 0 0 0 2px rgba(255,255,255,.35),inset 0 0 14px rgba(0,0,0,.6)}
.rim::after{content:"";position:absolute;inset:4.6%;border-radius:50%;
  background:conic-gradient(from 20deg,#2a2e33,#c8cdd2,#454a50,#f2f4f5,#2c3035,#aab0b6,#2a2e33);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.4)}
.glass{position:absolute;inset:7.4%;border-radius:50%;overflow:hidden;background:#010203;z-index:1;
  box-shadow:0 0 0 2px #000,0 0 0 3px rgba(255,255,255,.18);touch-action:none}
.glass canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default}
.glass::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:3;
  background:radial-gradient(70% 45% at 34% 14%,rgba(255,255,255,.12),transparent 60%),radial-gradient(circle,transparent 62%,rgba(0,0,0,.55) 100%);
  box-shadow:inset 0 0 28px rgba(0,0,0,.9),inset 0 0 4px #000}
.plabels{position:absolute;inset:7.4%;pointer-events:none;z-index:4}
.bl{position:absolute;left:0;top:0;will-change:transform;transform:translate(-50%,0);font:600 10px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:#eef0f2;white-space:nowrap;
  text-shadow:0 0 4px #000,0 0 8px #000,0 0 12px color-mix(in srgb,var(--c) 70%,transparent);transition:opacity .2s}
.bl.off{opacity:.45}
.bl i{font-style:normal;display:inline-block;margin-right:5px;padding:2px 4px 1px;border-radius:3px;background:var(--rc);color:#0b0d0f;letter-spacing:.04em;text-shadow:none;font-weight:700;vertical-align:1px}
.bl i[hidden]{display:none}
.pflow{position:absolute;inset:0;pointer-events:none}
.chev{position:absolute;left:0;top:0;width:8px;height:9px;background:var(--c);clip-path:polygon(0 0,100% 50%,0 100%,30% 50%);filter:drop-shadow(0 0 3px var(--c));opacity:.85;will-change:transform}
.chev.loop{width:7px;height:8px;opacity:.75}
.chev[hidden]{display:none}
.bl.is-sel{color:#fff}
.rim-lab{position:absolute;top:50%;width:0;height:0;z-index:2;pointer-events:none}
.rim-lab span{position:absolute;left:0;top:0;transform:translate(-50%,-50%) rotate(-90deg);font:700 clamp(8px,1.6vw,11px)/1 var(--f-ui);letter-spacing:.34em;color:#202326;text-shadow:0 1px 0 rgba(255,255,255,.75);white-space:nowrap}
.rim-lab.in{left:3.7%}
.rim-lab.out{left:96.3%}
.rim-lab.out span{transform:translate(-50%,-50%) rotate(90deg)}
.rt{all:unset;position:absolute;z-index:5;cursor:pointer;display:grid;justify-items:center;gap:1px;transform:translate(-50%,-50%);width:46px}
.rt .tg-sw{width:26px;height:26px}
.rt b{font:700 10px/1 var(--f-ui);letter-spacing:.06em;color:var(--etch);display:flex;align-items:center;gap:4px;text-shadow:0 1px 2px #000}
.rt b .led{width:6px;height:6px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 1px 1px #000}
.rt[data-on] b .led{background:var(--c);box-shadow:0 0 6px var(--c)}
.rt span.st{font:400 9.5px/1 var(--f-mono);color:var(--ink-2);text-shadow:0 1px 2px #000}
.rt:focus-visible{outline:2px solid var(--lcd-ink);outline-offset:2px;border-radius:6px}
.addnode{all:unset;cursor:pointer;position:absolute;left:50%;bottom:-4%;transform:translate(-50%,0);z-index:6;box-sizing:border-box;width:158px;height:46px;
  display:flex;align-items:center;justify-content:center;gap:9px;padding:0 4px 0 0;border-radius:999px;font:700 15px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#0c0e10;text-shadow:0 1px 0 rgba(255,255,255,.9),0 0 1px rgba(255,255,255,.6);
  background:var(--img-pill-wide) center/100% 100% no-repeat;
  box-shadow:0 4px 8px rgba(0,0,0,.65),0 0 22px rgba(148,232,255,.3)}
.addnode:hover{box-shadow:0 4px 8px rgba(0,0,0,.65),0 0 30px rgba(148,232,255,.55)}
.addnode:active{transform:translate(-50%,1px)}
.addnode svg{width:14px!important;height:14px!important}
.addnode:focus-visible{outline:2px solid var(--lcd-ink);outline-offset:2px}
.addnode svg{width:12px;height:12px}
.padinfo{position:absolute;left:50%;top:-5.6%;transform:translate(-50%,0);font:400 11px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.06em;white-space:nowrap;z-index:6}
.padinfo b{font-weight:400;color:var(--ink-2)}
.drophint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;
  font:700 11px/1 var(--f-ui);letter-spacing:.24em;color:#fff;padding:9px 13px;border-radius:999px;background:rgba(255,70,60,.25);box-shadow:0 0 0 1px rgba(255,120,110,.6),0 0 24px rgba(255,70,60,.5);opacity:0;transition:opacity .15s}
.drophint.on{opacity:1}

/* ---------- node bay ---------- */
.nodebay{display:flex;flex-direction:column;gap:11px;min-width:0;min-height:0;overflow:hidden}
.nodebay>*{flex-shrink:0}
.nodebay>.ppage{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:#2a2f34 transparent;padding-right:2px}
.nodebay>.ppage>*{flex-shrink:0}
/* the page fills the bay: knob rows span the width, knobs are larger (larger still in short rows),
   displays grow into the free height, and whatever is left is split above and below */
.nodebay>.ppage{justify-content:center}
.ppage .krow{grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:16px 6px}
.ppage .krow.lgk{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.ppage .kn,.ppage .kn.md,.ppage .kn.lg,.ppage .kn.sm{--kz:74px}
.ppage .krow.few .kn{--kz:88px}
.ppage.dense .kn,.ppage.dense .krow.few .kn{--kz:62px}
.ppage .kn-lab{font-size:11px}
.nodebay>.ppage>.scr{flex:1 1 auto;max-height:230px;min-height:84px}
.ppage .sinsp .krow{grid-template-columns:repeat(2,70px)}
.ppage .sinsp .kn{--kz:56px}
.ptabs{display:flex;gap:2px;border-bottom:1px solid rgba(255,255,255,.08)}
.ptab{all:unset;cursor:pointer;position:relative;padding:8px 14px 9px;font:700 10.5px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);border-radius:6px 6px 0 0}
.ptab:hover{color:var(--ink-2)}
.ptab[aria-selected="true"]{color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.06),transparent)}
.ptab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--c);box-shadow:0 0 10px var(--c)}
.ptab:focus-visible{outline:2px solid var(--lcd-ink);outline-offset:-2px}
.nb-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.nb-title{display:grid;gap:7px;min-width:0}
.nb-title h2{font:700 22px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:#f3f5f6;text-wrap:balance;
  text-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.nb-title p{font:500 12px/1.35 var(--f-ui);color:var(--ink-2);max-width:62ch}
.nb-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nb-path{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nb-path .lab{font:600 10px/1 var(--f-ui);letter-spacing:.18em;color:var(--ink-3)}
.sect{display:grid;gap:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.sect>h3{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 10px/1 var(--f-ui);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}
.krow{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:12px 4px;align-items:end;justify-items:center}
.krow.lgk{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
.ctrl-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px}
.empty{display:grid;place-items:center;align-content:center;gap:10px;min-height:260px;text-align:center;color:var(--ink-2)}
.empty h2{font:700 18px/1 var(--f-ui);letter-spacing:.2em;color:var(--ink)}

/* ---------- knobs ---------- */
.kn{--kz:54px;--c:#dfe6ec;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:calc(var(--kz) + 12px)}
.kn.xl{--kz:96px}.kn.lg{--kz:70px}.kn.md{--kz:56px}.kn.sm{--kz:46px}.kn.xs{--kz:38px}
.kn-dial{position:relative;width:var(--kz);height:var(--kz);touch-action:none;cursor:ns-resize;border-radius:50%;outline:none;flex:none}
.kn-dial:focus-visible{box-shadow:0 0 0 2px var(--lcd-ink)}
.kn-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.kr-tick{fill:none;stroke:var(--etch);stroke-width:1.4;opacity:.5;stroke-linecap:round}
.kr-track{fill:none;stroke:rgba(0,0,0,.75);stroke-width:3.4;stroke-linecap:round}
.kr-val{fill:none;stroke:var(--c);stroke-width:2.3;stroke-linecap:round}
.kr-mod{fill:none;stroke:var(--mc,#fff);stroke-width:1.7;stroke-linecap:round;stroke-dasharray:1.4 2.3}
.kr-dot{fill:var(--mc,#fff);stroke:#000;stroke-width:.8;display:none}
.kn.mod .kr-dot{display:block}
.kn.mod .kn-ring{will-change:transform}
.kn-body{position:absolute;inset:17%;border-radius:50%;background:var(--kimg,var(--kfb)) center/100% 100% no-repeat;filter:drop-shadow(1px 3px 3px rgba(0,0,0,.85)) drop-shadow(0 0 1px rgba(0,0,0,.9))}
/* photographed knobs (assets/knob.webp, knob-hero.webp), turned whole: the cap rotates to the value,
   offset by where the photo's own pointer slot sits (--kslot); the shadow stays on the still body */
.kn.silver,.kn.dark{--kimg:var(--img-knob);--kslot:2.2deg}
.kn.hero{--kimg:var(--img-knob-hero);--kslot:-134deg}
.kn.silver .kn-body,.kn.dark .kn-body,.kn.hero .kn-body{background:none}
.kn-cap{position:absolute;inset:0;border-radius:50%;background:var(--kimg) center/100% 100% no-repeat;transform:rotate(calc(var(--ka,0deg) - var(--kslot,0deg)))}
.kn-ptr{position:absolute;inset:17%;pointer-events:none}
.kn.silver .kn-ptr,.kn.dark .kn-ptr,.kn.hero .kn-ptr{display:none}
.kn-ptr i{position:absolute;left:calc(50% - 1px);width:2px;border-radius:1px;top:15%;height:20%;background:#121416;box-shadow:0 1px 0 rgba(255,255,255,.55)}
.kn.dark .kn-ptr i{background:#f2f4f5;box-shadow:0 0 2px rgba(0,0,0,.9)}
.kn-lab{position:relative;height:12px;font:600 10.5px/12px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--etch);white-space:nowrap;text-align:center}
.kn-lab .v{position:absolute;left:50%;top:-3px;transform:translateX(-50%);opacity:0;z-index:3;padding:2px 6px;border-radius:4px;color:var(--lcd-ink);font:13px/14px var(--f-mono);letter-spacing:0;white-space:nowrap;
  background:#03070a;box-shadow:0 0 0 1px rgba(148,232,255,.32),0 2px 6px rgba(0,0,0,.6);text-shadow:0 0 6px rgba(148,232,255,.45)}
.kn.act .l,.kn-dial:focus-visible+.kn-lab .l{opacity:0}
.kn.act .v,.kn-dial:focus-visible+.kn-lab .v{opacity:1}
@media (hover:hover){.kn:hover .l{opacity:0}.kn:hover .v{opacity:1}}
.kn.dim{opacity:.38}
body.assigning .kn:not(.nomod) .kn-dial{box-shadow:0 0 0 1px rgba(255,255,255,.22),0 0 12px rgba(255,255,255,.08)}
.kn.drop .kn-dial{box-shadow:0 0 0 2px var(--mc,#fff),0 0 20px var(--mc,#fff)!important}
.kn.flash .kn-dial{animation:kflash .6s ease-out}
@keyframes kflash{0%{box-shadow:0 0 0 2px var(--mc),0 0 28px var(--mc)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- toggles, chips, buttons ---------- */
.tg{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:46px}
.tg-sw{display:block;width:32px;height:32px;background:var(--tog-dn,radial-gradient(circle at 50% 70%,#f5f7f8 0 18%,#8b9298 22% 30%,#3a3f44 34% 48%,transparent 52%)) center/100% 100% no-repeat;filter:drop-shadow(1px 2px 1.5px rgba(0,0,0,.75))}
.tg[aria-pressed="true"] .tg-sw,.rt[data-on] .tg-sw{background-image:var(--tog-up,radial-gradient(circle at 50% 30%,#f5f7f8 0 18%,#8b9298 22% 30%,#3a3f44 34% 48%,transparent 52%))}
.tg-l{display:flex;align-items:center;gap:5px;font:600 10.5px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--etch);white-space:nowrap}
.tg-l .led{width:6px;height:6px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 1px 1px #000}
.tg[aria-pressed="true"] .led{background:var(--c,var(--menv));box-shadow:0 0 6px var(--c,var(--menv))}
.tg:focus-visible{outline:2px solid var(--lcd-ink);outline-offset:3px;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{all:unset;cursor:pointer;font:600 10.5px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;padding:7px 9px;border-radius:5px;color:var(--ink-2);white-space:nowrap;
  background:linear-gradient(180deg,#1f2226,#121417);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px #000,0 1px 2px rgba(0,0,0,.6)}
.chip:hover{color:var(--ink)}
.chip[aria-checked="true"],.chip[aria-pressed="true"]{color:#05080a;background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--lcd-ink)) 75%,#fff),var(--c,var(--lcd-ink)));box-shadow:0 0 12px -3px var(--c,var(--lcd-ink)),inset 0 1px 0 rgba(255,255,255,.5),0 0 0 1px #000}
.chip:focus-visible{outline:2px solid var(--lcd-ink);outline-offset:2px}
.chip.danger{color:#ffb3ad}
.chip.danger.arm{color:#fff;background:linear-gradient(180deg,#ff6b60,#c8322a)}
.chip svg{width:11px;height:11px;vertical-align:-1px}
.pbtn{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--ink-2);background:linear-gradient(180deg,#1f2226,#121417);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px #000}
.pbtn:hover{color:var(--ink)}
.pbtn:focus-visible{outline:2px solid var(--lcd-ink)}
.pbtn svg{width:12px;height:12px}
.pbtn[disabled]{opacity:.3;cursor:default}

/* ---------- widget screens ---------- */
.scr{position:relative;border-radius:8px;overflow:hidden;background:linear-gradient(180deg,#020406,#071015);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 4px 14px rgba(0,0,0,.9),0 0 0 1px #000,0 1px 0 rgba(255,255,255,.08)}
.scr canvas{display:block;width:100%;height:100%;touch-action:none}
.scr-cap{position:absolute;left:9px;top:8px;font:400 10.5px/1 var(--f-mono);color:#4f8a9b;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.scr-cap.r{left:auto;right:9px}
.irsel{all:unset;cursor:pointer;display:grid;gap:4px;padding:9px 12px;border-radius:7px;min-width:0;
  background:linear-gradient(180deg,#04070a,#0b1216);box-shadow:inset 0 2px 8px #000,0 0 0 1px #000,0 1px 0 rgba(255,255,255,.08)}
.irsel b{font:400 16px/1.1 var(--f-mono);color:var(--lcd-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irsel span{font:400 10.5px/1 var(--f-mono);color:#4f8a9b;text-transform:uppercase;letter-spacing:.08em}
.irsel:focus-visible{outline:2px solid var(--lcd-ink)}

.chips.tight{gap:3px}.chips.tight .chip{padding:7px 0;min-width:27px;text-align:center}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.sinsp{display:grid;grid-template-columns:auto auto;gap:10px 18px;align-items:center;justify-content:start;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.025);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sinsp-h{display:grid;gap:8px;justify-items:start}
.sinsp-h>b{font:700 11px/1 var(--f-ui);letter-spacing:.2em;color:var(--ink)}
.sinsp-h>span{font:600 9.5px/1 var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.srcpick{display:flex;align-items:center;gap:6px}
.srcpick b{min-width:26px;text-align:center;font-size:18px;color:var(--lcd-ink);font-weight:400}
.sinsp .krow{grid-template-columns:repeat(2,70px)}
.srow>.chips{flex-direction:column;align-items:stretch}
.tab8{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.tcol{display:grid;gap:5px;justify-items:stretch}
.tbar{position:relative;height:92px;border-radius:5px;touch-action:none;cursor:ns-resize;background:linear-gradient(180deg,#05080a,#0a1014);box-shadow:inset 0 2px 6px #000,0 0 0 1px #000}
.tbar i{position:absolute;left:3px;right:3px;border-radius:3px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c));box-shadow:0 0 10px -2px var(--c)}
.tbar .z{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.12)}
.tbar b{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:400 10.5px/1 var(--f-mono);color:var(--ink);text-shadow:0 1px 2px #000}
.tbar:focus-visible{outline:2px solid var(--lcd-ink)}
.tcol .chip{text-align:center;padding:6px 2px;font-size:9px;letter-spacing:.04em}
.tnum{font:600 10px/1 var(--f-ui);color:var(--ink-3);text-align:center;letter-spacing:.1em}

.chord{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.chordlcd{min-width:118px;padding:10px 12px;border-radius:7px;background:linear-gradient(180deg,#04070a,#0b1216);box-shadow:inset 0 2px 8px #000,0 0 0 1px #000}
.chordlcd b{display:block;font:400 26px/1 var(--f-mono);color:var(--lcd-ink);text-shadow:0 0 10px rgba(148,232,255,.5)}
.chordlcd span{display:block;margin-top:6px;font:400 10.5px/1 var(--f-mono);color:#4f8a9b;letter-spacing:.08em}
.keys{position:relative;height:58px;border-radius:5px;overflow:hidden;background:#000;box-shadow:0 0 0 1px #000,0 1px 0 rgba(255,255,255,.08)}
.keys button{all:unset;position:absolute;top:0;cursor:pointer}
.keys .w{height:100%;background:linear-gradient(180deg,#d9dde0,#f6f7f8 80%,#c3c8cc);box-shadow:inset -1px 0 0 #6c7279,inset 0 -3px 0 rgba(0,0,0,.18)}
.keys .b{height:60%;background:linear-gradient(180deg,#26292d,#0a0b0d);box-shadow:inset 0 -3px 0 rgba(255,255,255,.08),0 2px 3px rgba(0,0,0,.6);z-index:2}
.keys .w.on{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c))}
.keys .b.on{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#000),var(--c))}
.keys .root::after{content:"";position:absolute;left:50%;bottom:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#05080a}
.keys button:focus-visible{outline:2px solid var(--lcd-ink);outline-offset:-2px}

/* ---------- modulation rail ---------- */
.modrail{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:18px;align-items:center;padding:12px 20px;min-height:0}
.srcs{display:grid;grid-template-columns:repeat(2,auto);gap:12px 12px}
.src{all:unset;cursor:grab;touch-action:none;display:grid;justify-items:center;gap:6px}
/* metal pills (assets/pill-src.webp 80 x 34, pill-wide.webp 158 x 46): the supplied pill re-rendered at
   each button's exact size by UI/tools/prep_assets.py, so nothing is stretched */
.src .pill{display:flex;align-items:center;gap:7px;width:80px;height:34px;box-sizing:border-box;justify-content:center;border-radius:999px;
  font:700 11.5px/1 var(--f-ui);letter-spacing:.13em;color:#0c0e10;text-shadow:0 1px 0 rgba(255,255,255,.9),0 0 1px rgba(255,255,255,.6);
  background:var(--img-pill-src) center/100% 100% no-repeat;
  box-shadow:0 3px 6px rgba(0,0,0,.6)}
.src .pill .led{width:7px;height:7px;border-radius:50%;background:#3b4045;box-shadow:inset 0 1px 1px rgba(0,0,0,.8)}
.src[aria-pressed="true"] .pill .led{background:var(--mc);box-shadow:0 0 7px var(--mc),0 0 1px #fff}
.src[aria-pressed="true"] .pill{box-shadow:0 3px 6px rgba(0,0,0,.6),0 0 16px -2px var(--mc)}
.src small{font:400 10px/1 var(--f-mono);color:var(--ink-3)}
.src:focus-visible .pill{outline:2px solid var(--lcd-ink);outline-offset:2px}
.modscr{display:grid;grid-template-rows:auto 88px;gap:0;min-width:0}
.modbar{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow:hidden;padding:7px 8px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#14171a,#0b0d0f);box-shadow:0 0 0 1px #000,inset 0 1px 0 rgba(255,255,255,.07)}
.modbar .chip{padding:6px 6px;font-size:9.5px;letter-spacing:.06em}
.modbar .sp{flex:1}
.shapegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.shapegrid .shapeb{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px}
.modbar .chipsep{width:1px;height:16px;margin:0 3px;background:rgba(255,255,255,.12);flex:none}
.modscr .scr{border-radius:0 0 8px 8px}
.srcctl{display:flex;align-items:flex-end;gap:12px}
.macro{display:grid;justify-items:center;gap:8px}
.grip{all:unset;cursor:grab;touch-action:none;display:flex;align-items:center;gap:6px;font:600 9.5px/1 var(--f-ui);letter-spacing:.16em;color:var(--ink-2);padding:6px 9px;border-radius:999px;background:#0b0d0f;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.grip i{width:8px;height:8px;border-radius:50%;background:var(--mc);box-shadow:0 0 8px var(--mc)}
.grip:focus-visible{outline:2px solid var(--lcd-ink)}
.ghost{position:fixed;z-index:80;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 34%,#fff 0,var(--mc) 35%,color-mix(in srgb,var(--mc) 30%,transparent) 70%);box-shadow:0 0 22px var(--mc)}
.rtcount{all:unset;cursor:pointer;font:600 10px/1 var(--f-ui);letter-spacing:.16em;color:var(--ink-2);padding:7px 10px;border-radius:999px;box-shadow:0 0 0 1px rgba(255,255,255,.12);white-space:nowrap}
.rtcount:hover{color:var(--ink)}
.rtcount:focus-visible{outline:2px solid var(--lcd-ink)}

/* ---------- windows ---------- */
.wback{position:absolute;inset:-2px;z-index:60;display:grid;place-items:center;border-radius:14px;background:rgba(2,3,4,.72);backdrop-filter:blur(5px);
  padding:12px;animation:fade .16s ease-out}
@keyframes fade{from{opacity:0}}
.win{width:min(600px,92%);max-height:94%;display:grid;grid-template-rows:auto minmax(0,1fr);border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,#16191c,#0a0b0d);box-shadow:0 0 0 1px #000,0 0 0 3px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12)}
.win.wide{width:min(780px,94%)}
.win-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;
  background-image:var(--brushed,linear-gradient(transparent,transparent)),linear-gradient(180deg,#eef0f2,#bfc4c9 50%,#a8aeb4 52%,#d8dbde);background-size:512px 512px,100% 100%;background-blend-mode:overlay,normal;
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.5)}
.win-h h2{font:400 14px/1 var(--f-logo);letter-spacing:.12em;color:var(--engrave);text-shadow:0 1px 0 rgba(255,255,255,.8)}
.win-x{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:#1b1e21;background:linear-gradient(180deg,#fff,#b5bbc0);box-shadow:0 0 0 1px #000,0 2px 3px rgba(0,0,0,.5)}
.win-x:focus-visible{outline:2px solid #0b5f78}
.win-x svg{width:12px;height:12px}
.win-b{overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.win-tabs{display:flex;gap:5px;flex-wrap:wrap}
.plist{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.pitem{all:unset;cursor:pointer;display:grid;gap:5px;padding:10px 12px;border-radius:8px;min-width:0;background:#0c0e10;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.pitem:hover{background:#121519}
.pitem:focus-visible{outline:2px solid var(--lcd-ink)}
.pitem[aria-current="true"]{box-shadow:inset 0 0 0 1px var(--lcd-ink),0 0 14px -6px var(--lcd-ink)}
.pitem b{font:600 15px/1.1 var(--f-ui);letter-spacing:.04em;color:var(--ink)}
.pitem span{display:flex;flex-wrap:wrap;gap:4px}
.pitem em{font:normal 400 10.5px/1 var(--f-mono);padding:3px 5px;border-radius:3px;color:#05080a;background:var(--c)}
.pitem small{font:400 11px/1.3 var(--f-mono);color:var(--ink-3)}
.wnote{font:500 13px/1.45 var(--f-ui);color:var(--ink-2);max-width:62ch}
.field{display:grid;gap:6px}
.field label{font:600 10px/1 var(--f-ui);letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.inp{width:100%;padding:11px 12px;border-radius:7px;border:0;background:#05080a;color:var(--lcd-ink);font:400 16px/1 var(--f-mono);box-shadow:inset 0 2px 6px #000,0 0 0 1px rgba(255,255,255,.1)}
.inp:focus{outline:2px solid var(--lcd-ink)}
.sel{padding:9px 10px;border-radius:7px;border:0;background:#05080a;color:var(--ink);font:500 13px/1 var(--f-ui);box-shadow:0 0 0 1px rgba(255,255,255,.12);min-width:0}
.sel:focus{outline:2px solid var(--lcd-ink)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:999px;font:700 11px/1 var(--f-ui);letter-spacing:.18em;color:#1b1e21;text-transform:uppercase;
  background:linear-gradient(180deg,#f6f7f8,#b9bfc4 48%,#949ba1 52%,#dadee1);box-shadow:0 0 0 1px #000,0 3px 6px rgba(0,0,0,.6),inset 0 1px 0 #fff}
.btn:focus-visible{outline:2px solid var(--lcd-ink);outline-offset:2px}
.btn.ghostb{color:var(--ink);background:transparent;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.btn[disabled]{opacity:.4;cursor:default}
.rlist{display:grid;gap:7px}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(90px,170px) 46px auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:#0c0e10;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.rrow .dot{width:9px;height:9px;border-radius:50%;background:var(--mc);box-shadow:0 0 8px var(--mc)}
.rrow b{font:600 12.5px/1.25 var(--f-ui);color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow b span{color:var(--ink-3);font-weight:500}
.rrow output{font:400 12px/1 var(--f-mono);color:var(--ink-2);text-align:right}
input[type=range]{width:100%;accent-color:var(--mc,var(--lcd-ink))}
.addr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.nopt{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;padding:11px 12px;border-radius:9px;background:#0c0e10;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.nopt:hover{background:#12151a}
.nopt:focus-visible{outline:2px solid var(--lcd-ink)}
.nopt[aria-disabled="true"]{opacity:.38;cursor:default}
.nopt i{grid-row:span 2;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 30%,color-mix(in srgb,var(--c) 25%,#000) 75%);box-shadow:0 0 12px -2px var(--c)}
.nopt b{font:700 13px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.nopt small{font:500 11.5px/1.25 var(--f-ui);color:var(--ink-2)}
.irdrop{display:grid;place-items:center;gap:6px;padding:18px;border-radius:9px;text-align:center;border:1px dashed rgba(148,232,255,.35);color:var(--ink-2);font:500 13px/1.4 var(--f-ui)}
.irdrop.over{background:rgba(148,232,255,.06);border-color:var(--lcd-ink)}
.irdrop input{display:none}
.irdrop label{cursor:pointer;color:var(--lcd-ink);text-decoration:underline;text-underline-offset:3px}
.irgrid{display:grid;gap:12px}
.ircat h3{font:600 10px/1 var(--f-ui);letter-spacing:.22em;color:var(--ink-3);margin-bottom:7px;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;padding:10px 16px;border-radius:999px;
  font:600 12px/1 var(--f-ui);letter-spacing:.08em;color:#05080a;background:var(--lcd-ink);box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none;animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ---------- responsive ---------- */
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* =========================================================
   Pleroma FX - core utilities, parameter store, event bus
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RNG=Math.random;
const rnd=(a=0,b=1)=>a+(b-a)*RNG();
const pick=a=>a[Math.floor(RNG()*a.length)];
function randn(){let u=0,v=0;while(u===0)u=RNG();while(v===0)v=RNG();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}
/* Plugin host (JUCE WebBrowserComponent native integration). Absent when the page runs standalone. */
const HOST=(()=>{const J=window.__JUCE__,d=J&&J.initialisationData;const hosted=!!(d&&d.pleromaHosted&&d.pleromaHosted[0]);
  return {hosted,init:k=>d&&d[k]?d[k][0]:undefined,
    send(m){if(!hosted)return;try{J.backend.emitEvent('pleroma',m);}catch(e){}},
    on(fn){if(hosted&&J.backend)J.backend.addEventListener('pleromaHost',fn);}};})();
const HOST_STORE=HOST.hosted?Object.assign({},HOST.init('pleromaStore')||{}):null;
const store={
  get(k,d){if(HOST_STORE){const v=HOST_STORE[k];return v==null?d:JSON.parse(JSON.stringify(v));}
    try{const v=localStorage.getItem('pleroma-fx:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){if(HOST_STORE){if(k==='session')return;HOST_STORE[k]=v;HOST.send({type:'storeSet',key:k,value:v});return;}
    try{localStorage.setItem('pleroma-fx:'+k,JSON.stringify(v));}catch(e){}}
};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)');
const COARSE=matchMedia('(pointer: coarse)');
function toast(msg){const t=el(`<div class="toast" role="status">${esc(msg)}</div>`);document.body.append(t);setTimeout(()=>t.remove(),2300);}
const ICON={
  x:'<svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8"/></svg>',
  l:'<svg viewBox="0 0 12 12"><path d="M8 1 3 6l5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
  r:'<svg viewBox="0 0 12 12"><path d="m4 1 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
  trash:'<svg viewBox="0 0 12 12"><path d="M2 3h8M4.5 3V1.6h3V3M3 3l.6 7.5h4.8L9 3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>'
};

/* ---------- event bus ---------- */
const BUS={};
function onE(n,f){(BUS[n]||(BUS[n]=new Set())).add(f);return()=>BUS[n].delete(f);}
function emit(n,...a){if(BUS[n])for(const f of BUS[n])f(...a);}

/* ---------- musical constants ---------- */
const NOTE=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
/* BeatDivision table from the spec (19 entries, spec order). b = length in quarter-note beats (240/BPM * D seconds) */
const DIVS=[
  {l:'1/64',b:1/16},{l:'1/32T',b:1/12},{l:'1/32',b:1/8},{l:'1/16T',b:1/6},{l:'1/16',b:1/4},{l:'1/16D',b:3/8},{l:'1/8T',b:1/3},
  {l:'1/8',b:1/2},{l:'1/8D',b:3/4},{l:'1/4T',b:2/3},{l:'1/4',b:1},{l:'1/4D',b:1.5},{l:'1/2T',b:4/3},{l:'1/2',b:2},{l:'1/2D',b:3},
  {l:'1/1',b:4},{l:'2/1',b:8},{l:'3/1',b:12},{l:'4/1',b:16}
];
const DIV_ALIAS={'1 bar':'1/1','2 bar':'2/1','4 bar':'4/1','1/8.':'1/8D','1/4.':'1/4D','1/16.':'1/16D'};
const DIV=l=>DIVS.findIndex(d=>d.l===(DIV_ALIAS[l]||l));
/* the pre-spec division list, used only to migrate older saved patches */
const OLD_DIVS=['4 bar','2 bar','1 bar','1/2','1/2T','1/4.','1/4','1/4T','1/8.','1/8','1/8T','1/16','1/16T','1/32'];
/* Time node loop length when synced (bars), as in TimeNode::kBarDivs */
const TIME_DIVS=[{l:'1/8 bar',bars:.125},{l:'1/4 bar',bars:.25},{l:'1/2 bar',bars:.5},{l:'1 bar',bars:1},{l:'1.5 bars',bars:1.5},{l:'2 bars',bars:2},{l:'3 bars',bars:3},{l:'4 bars',bars:4}];
const midiName=m=>NOTE[((Math.round(m)%12)+12)%12]+(Math.floor(Math.round(m)/12)-1);
const hzNote=hz=>{const m=69+12*Math.log2(hz/440);const r=Math.round(m);const c=Math.round((m-r)*100);return NOTE[(r%12+12)%12]+(Math.floor(r/12)-1)+(c?(c>0?' +':' ')+c+'c':'');};

/* ---------- value formatters ---------- */
const sgn=v=>v>0?'+':'';
const F={

  if(!(ring>=0&&ring<6))ring=0;ring=Math.round(ring);
  if(typeof ang!=='number'||!isFinite(ang))ang=freeAngle(ring);
  const id='n'+(S.nextId++);
  const n={id,t,ring,ang,x:null};
  if(isPortal(n)){
    n.pair=opts.pair||freePairId();
    const p=n.pair+'.';
    if(!P[p+'delay']){for(const [k,s] of Object.entries(T.portal.params))defP(p+k,s,vals&&vals[k]);defP(p+'on',TOG('On',1),vals&&vals.on);}
  }else{
    for(const [k,s] of Object.entries(T[t].params))defP(id+'.'+k,s,vals&&vals[k]);
    defP(id+'.on',TOG('On',1),vals&&vals.on);
    n.x=Object.assign(T[t].x0?T[t].x0():{},x?clone(x):{});
  }
  initVis(n,opts.spawn);
  S.nodes.push(n);
  if(!opts.quiet)emit('graph');
  return n;
}
function removeNode(n,opts={}){
  const group=isPortal(n)?pairNodes(n.pair):[n];
  for(const m of group){
    if(m.vis){m.vis.pop=PADT;spawnRipple(m.vis.x,m.vis.y,1.3);}
  }
  const keyPre=pre(n);
  MOD.routes=MOD.routes.filter(r=>!r.k.startsWith(keyPre));
  setTimeout(()=>{S.nodes=S.nodes.filter(m=>!group.includes(m));if(!live().some(m=>pre(m)===keyPre))delPrefix(keyPre);},320);
  if(group.includes(S.sel)){const rest=live().filter(m=>!group.includes(m));S.sel=rest.length?rest[0]:null;}
  DIRTY=true;
  if(!opts.quiet){emit('graph');emit('select');emit('routes');}
}
function select(n){S.sel=n;if(n&&n.vis)n.vis.kick=1;emit('select');}

/* ---------- routing: order along each ring ---------- */
const nx=n=>Math.cos(n.ang);
function ringNodes(i,list=live()){return list.filter(n=>n.ring===i).sort((a,b)=>nx(a)-nx(b)||a.ang-b.ang);}
function pathOf(n){return ringNodes(n.ring);}
function activeRings(list=live()){const a=[];for(let i=0;i<6;i++)if(list.some(n=>n.ring===i))a.push(i);return a;}
/* one closed feedback loop per pair whose In and Out share a path */
function portalSpan(pid,list=live()){
  const pin=list.find(n=>n.t==='portalIn'&&n.pair===pid),pout=list.find(n=>n.t==='portalOut'&&n.pair===pid);
  if(!pin||!pout||pin.ring!==pout.ring)return null;
  const path=ringNodes(pin.ring,list);const a=path.indexOf(pin),b=path.indexOf(pout);
  return {pid,ring:pin.ring,pin,pout,inside:path.slice(Math.min(a,b)+1,Math.max(a,b)),a:Math.min(a,b),b:Math.max(a,b)};
}
/* keep each Portal In upstream of its Portal Out */
function fixPortalOrder(){
  for(const pid of pairIds()){
    const pin=live().find(n=>n.t==='portalIn'&&n.pair===pid),pout=live().find(n=>n.t==='portalOut'&&n.pair===pid);
    if(pin&&pout&&pin.ring===pout.ring&&nx(pin)>nx(pout)){pin.t='portalOut';pout.t='portalIn';}

}
/* spread nodes that sit too close on one ring */
function relaxRing(i,fixed){
  const list=ringNodes(i);if(list.length<2)return;
  const R=RING_R[i],minA=(BUB_R*2.35)/R;
  for(let it=0;it<30;it++){
    let moved=false;
    for(let a=0;a<list.length;a++)for(let b=a+1;b<list.length;b++){
      const A=list[a],B=list[b];let d=B.ang-A.ang;d=Math.atan2(Math.sin(d),Math.cos(d));
      if(Math.abs(d)<minA){const push=(minA-Math.abs(d))/2*Math.sign(d||1);
        if(A!==fixed)A.ang-=push*(B===fixed?2:1);if(B!==fixed)B.ang+=push*(A===fixed?2:1);moved=true;}
    }
    if(!moved)break;
  }
  for(const n of list)n.ang=Math.atan2(Math.sin(n.ang),Math.cos(n.ang));
}
function freeAngle(i){
  const list=ringNodes(i);
  const cands=[];for(let k=0;k<24;k++)cands.push(-Math.PI+.13+k*(TAU/24));
  let best=-Math.PI/2,bs=-1;
  for(const a of cands){let m=9;for(const n of list){let d=Math.abs(Math.atan2(Math.sin(a-n.ang),Math.cos(a-n.ang)));m=Math.min(m,d);}
    const s=m+(a<0?.35:0)-Math.abs(Math.abs(a)-Math.PI/2)*.05;if(s>bs){bs=s;best=a;}}

}
function partnerOf(n){return isPortal(n)?pairNodes(n.pair).filter(m=>m!==n):[];}
function moveNodeToRing(n,ring){
  const pair=partnerOf(n);
  n.ring=ring;n.ang=freeAngle(ring);for(const m of pair){m.ring=ring;m.ang=freeAngle(ring);}
  relaxRing(ring,n);fixPortalOrder();DIRTY=true;emit('graph');emit('select');
}
function shiftOrder(n,dir){
  const path=pathOf(n),i=path.indexOf(n),j=i+dir;if(j<0||j>=path.length)return;
  const m=path[j];const t=n.ang;n.ang=m.ang;m.ang=t;fixPortalOrder();DIRTY=true;emit('graph');emit('select');

/* spec 2.2: G = 1 / N^0.35, in dB = -7 log10(N) */
const GAIN_ALPHA=.35;
const gainComp=k=>k<=1?0:-20*GAIN_ALPHA*Math.log10(k);

/* ---------- routes ---------- */
function addRoute(src,k,d){
  if(!P[k]||P[k].s.nomod)return false;
  d=clamp(d,-MAX_ROUTE_DEPTH,MAX_ROUTE_DEPTH);
  const ex=MOD.routes.find(r=>r.s===src&&r.k===k);
  if(ex){ex.d=d;}else MOD.routes.push({s:src,k,d});
  DIRTY=true;emit('routes');return true;
}
function delRoute(r){MOD.routes=MOD.routes.filter(x=>x!==r);DIRTY=true;emit('routes');}
function keyLabel(k){
  if(k.startsWith('g.'))return {node:'Global',param:P[k].s.label};
  const id=k.split('.')[0];
  if(/^p\d+$/.test(id))return {node:pairName(id),param:P[k]?P[k].s.label:k};
  const n=byId(id);

}

const FS_BAKE=`#version 300 es
precision highp float;

out vec4 o;
const float CAM=8.0;
float h12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float softRect(vec3 d,vec3 c,vec2 hs,float s){
  float cd=dot(d,c);if(cd<=0.)return 0.;
  vec3 ax=normalize(cross(vec3(0.,0.,1.),c));vec3 ay=cross(c,ax);
  vec3 p=d/cd-c;vec2 q=vec2(dot(p,ax),dot(p,ay));

vec3 env(vec3 d,float r){
  float s=.03+r*.6,k=1./(1.+r*2.2);
  vec3 col=mix(vec3(.008,.009,.011),vec3(.05,.053,.06),smoothstep(-.3,1.,d.z));
  col+=vec3(1.,.97,.92)*7.5*k*softRect(d,normalize(vec3(-.45,.5,.74)),vec2(.55,.3),s);
  col+=vec3(.72,.84,1.)*3.4*k*softRect(d,normalize(vec3(.92,-.1,.38)),vec2(.07,.75),s);
  col+=vec3(1.,.88,.75)*1.2*k*softRect(d,normalize(vec3(.1,-.92,.38)),vec2(.9,.1),s);

vec2 knobSDF(vec3 p){
  float rho=length(p.xy),th=atan(p.y,p.x);
  float kn=abs(sin(th*30.));
  float gr=.026*(1.-smoothstep(0.,.35,kn));
  vec2 q=vec2(rho+gr,p.z);
  vec2 n=normalize(vec2(.45,.18));
  float dSide=dot(q-vec2(1.,0.),n);
  float dSk=max(dSide,max(-p.z,p.z-.45));

    float dBez=max(max(rho-.80,p.z-.53),(rho+p.z-1.31)*.7071);dBez=max(dBez,.3-p.z);
    float dDome=length(p-vec3(0.,0.,-.2827))-1.0627;dDome=max(dDome,.45-p.z);

float sdHex(vec3 p,vec2 h){const vec3 k=vec3(-.8660254,.5,.57735);p=abs(p);p.xy-=2.*min(dot(k.xy,p.xy),0.)*k.xy;
  vec2 d=vec2(length(p.xy-vec2(clamp(p.x,-k.z*h.x,k.z*h.x),h.x))*sign(p.y-h.x),p.z-h.y);return min(max(d.x,d.y),0.)+length(max(d,0.));}

vec2 toggleSDF(vec3 p){
  float s=uMode==3?1.:-1.;

}
vec2 screwSDF(vec3 p){
  float rho=length(p.xy),th=atan(p.y,p.x);
  float dome=max(length(p-vec3(0.,0.,-1.))-1.31,-p.z);

vec2 map(vec3 p){if(uMode<=2)return knobSDF(p);if(uMode<=4)return toggleSDF(p);return screwSDF(p);}
vec3 calcN(vec3 p){const vec2 e=vec2(.0006,-.0006);return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=1;i<=5;i++){float h=.015+.03*float(i);o+=(h-map(p+n*h).x)*s;s*=.75;}return clamp(1.-2.2*o,0.,1.);}
vec3 metal(vec3 n,vec3 v,vec3 alb,float r){vec3 R=reflect(-v,n);float ndv=clamp(dot(n,v),0.,1.);vec3 F=alb+(max(vec3(1.-r),alb)-alb)*pow(1.-ndv,5.);return env(R,r)*F;}

  if(p.z>.596&&rho<.662){

void main(){

  if(!hit){o=vec4(0.);return;}

  vec3 c=shade(p,n,v,h.y)*(.35+.65*ao(p,n));
  c=pow(aces(c*1.1),vec3(1./2.2));
  o=vec4(c,1.);
}`;

function glProg(gl,vs,fs){
  const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(sh));return null;}return sh;};
  const v=mk(gl.VERTEX_SHADER,vs),f=mk(gl.FRAGMENT_SHADER,fs);if(!v||!f)return null;
  const p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.warn(gl.getProgramInfoLog(p));return null;}
  return p;
}
function bakeAssets(){
  const cv=document.createElement('canvas');
  let gl=null;try{gl=cv.getContext('webgl2',{premultipliedAlpha:true,preserveDrawingBuffer:true,antialias:false,alpha:true});}catch(e){}

  const out=document.createElement('canvas'),oc=out.getContext('2d');
  const render=(mode,size,th)=>{
    const S2=size*2;cv.width=S2;cv.height=S2;gl.viewport(0,0,S2,S2);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uR,S2,S2);gl.uniform1i(uM,mode);gl.uniform3f(uT,0,0,0);gl.uniform1f(uTH,th);
    gl.drawArrays(gl.TRIANGLES,0,3);
    out.width=size;out.height=size;oc.clearRect(0,0,size,size);oc.imageSmoothingEnabled=true;oc.imageSmoothingQuality='high';oc.drawImage(cv,0,0,size,size);
    return out.toDataURL('image/png');
  };
  const st=document.documentElement.style;
  st.setProperty('--tog-up',`url(${render(3,144,.16)})`);
  st.setProperty('--tog-dn',`url(${render(4,144,.16)})`);
  st.setProperty('--screw',`url(${render(5,48,.115)})`);
  const lose=gl.getExtension('WEBGL_lose_context');if(lose)lose.loseContext();
  return true;
}
function brushedTex(){
  const w=512,h=512,c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d'),img=x.createImageData(w,h),d=img.data;
  for(let y=0;y<h;y++){
    const off=(Math.random()-.5)*26,A=[],Fq=[];
    for(let k=0;k<5;k++){A.push((Math.random()-.5)*10/(k+1));Fq.push(Math.random()*6.283);}
    for(let i=0;i<w;i++){
      let g=128+off*.7;for(let k=0;k<5;k++)g+=A[k]*Math.sin(6.2832*(k+1)*i/w+Fq[k]);
      g+=(Math.random()-.5)*6;const ix=(y*w+i)*4;d[ix]=d[ix+1]=d[ix+2]=clamp(g,0,255);d[ix+3]=255;
    }
  }
  x.putImageData(img,0,0);return c.toDataURL('image/jpeg',.82);

const ARC0=-135;
function polar(a,r){const t=(a-90)*Math.PI/180;return [50+r*Math.cos(t),50+r*Math.sin(t)];}
function arcPath(a0,a1,r){if(a1<a0){const t=a0;a0=a1;a1=t;}if(a1-a0<.5)a1=a0+.5;const [x0,y0]=polar(a0,r),[x1,y1]=polar(a1,r);return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;}
const ARC_R=40.5;
const ARC_FULL=arcPath(-135,135,ARC_R);
const TICKS=(()=>{let s='';for(let i=0;i<=10;i++){const a=-135+i*27,big=i%5===0;const [x0,y0]=polar(a,44.5),[x1,y1]=polar(a,big?50:48.3);s+=`M${x0.toFixed(2)} ${y0.toFixed(2)}L${x1.toFixed(2)} ${y1.toFixed(2)}`;}return s;})();
const KN=new Set();

      <svg class="kn-ring" viewBox="0 0 100 100" aria-hidden="true"><path class="kr-tick" d="${TICKS}"/><path class="kr-track" d="${ARC_FULL}"/><path class="kr-val"/><path class="kr-mod"/><circle class="kr-dot" r="3" cx="50" cy="50"/></svg>
      <div class="kn-body"><b class="kn-cap"></b></div><div class="kn-ptr"><i></i></div>
    </div>

  </div>`);

/* ---------- flow graph (with live drag preview) ---------- */

function buildFlow(){
  let list=live().map(n=>({id:n.id,t:n.t,pair:n.pair,ring:n.ring,ang:n.ang,ref:n}));
  let hiRing=-1;
  if(DRAG&&DRAG.moved){
    const pid=isPortal(DRAG.n)?DRAG.n.pair:null;
    if(DRAG.ring<0)list=list.filter(o=>pid?o.pair!==pid:o.ref!==DRAG.n);
    else{
      for(const o of list){
        if(o.ref===DRAG.n){o.ring=DRAG.ring;o.ang=DRAG.ang;}
        else if(pid&&o.pair===pid&&o.ring!==DRAG.ring){o.ring=DRAG.ring;o.ang=DRAG.ang+(o.t==='portalIn'?-.5:.5);}
      }
      hiRing=DRAG.ring;
    }
  }
  const segs=[],feeds=[],act=activeRings(list);
  for(const i of act){
    const L=ringNodes(i,list);
    const first=L[0],last=L[L.length-1];
    const s0=first.ang<0?-Math.PI:Math.PI;segs.push([i,s0,first.ang-s0,0]);
    for(let k=0;k<L.length-1;k++)segs.push([i,L[k].ang,wrapA(L[k+1].ang-L[k].ang),0]);
    segs.push([i,last.ang,-last.ang,0]);
    /* one return arc per closed portal pair; overlapping loops step inward so nested pairs stay readable */
    const spans=[];
    for(const pid of [...new Set(L.filter(o=>o.pair).map(o=>o.pair))]){
      const a=L.findIndex(o=>o.pair===pid&&o.t==='portalIn'),b=L.findIndex(o=>o.pair===pid&&o.t==='portalOut');
      if(a<0||b<0)continue;spans.push({a:Math.min(a,b),b:Math.max(a,b)});
    }
    spans.sort((p,q)=>(q.b-q.a)-(p.b-p.a));
    spans.forEach((sp,j)=>{
      const lvl=1+spans.slice(0,j).filter(o=>o.a<sp.b&&sp.a<o.b).length;
      let sum=0;for(let k=sp.a;k<sp.b;k++)sum+=wrapA(L[k+1].ang-L[k].ang);
      segs.push([i,L[sp.b].ang,-sum,Math.min(3,lvl)]);
    });
  }
  act.forEach((i,j)=>{const yo=(j-(act.length-1)/2)*.016;feeds.push([i,-1,yo]);feeds.push([i,1,yo]);});
  const order={},step={};for(const i of act)ringNodes(i,list).forEach((o,k)=>{order[o.id]=k;step[o.id]=PATHS[i]+(k+1);});
  FLOW={segs,feeds,act,hiRing,order,step};

}

function starTexture(size=1024,withStars=false){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');

    const g=x.createRadialGradient(px,py,0,px,py,r*3);g.addColorStop(0,'rgba(230,240,255,.85)');g.addColorStop(.25,'rgba(160,190,255,.25)');g.addColorStop(1,'transparent');

/* ---------- physics ---------- */
function stepPad(dt){
  if(FLOW_DIRTY)buildFlow();
  const bpm=V('g.bpm'),beat=PADT*bpm/60;
  const sub=Math.max(1,Math.ceil(dt/(1/120))),h=dt/sub;
  for(const n of S.nodes){
    const v=n.vis;if(!v)continue;
    for(let s=0;s<sub;s++){
      let tx,ty;
      if(v.drag){tx=v.dx;ty=v.dy;}else{const R=RING_R[n.ring];tx=R*Math.cos(n.ang);ty=R*Math.sin(n.ang);}
      const k=v.drag?1100:150,c=v.drag?66:19;
      v.vx+=((tx-v.x)*k-v.vx*c)*h;v.vy+=((ty-v.y)*k-v.vy*c)*h;
      v.x+=v.vx*h;v.y+=v.vy*h;
      const spd=Math.hypot(v.vx,v.vy),ph=Math.atan2(v.vy,v.vx),st=Math.min(.3,spd*.085);
      const t0=st*Math.cos(2*ph),t1=st*Math.sin(2*ph);
      for(let j=0;j<8;j++){const md=2+(j>>1),w=11+md*5.5,tg=j===0?t0:j===1?t1:0;v.mv[j]+=(-(w*w)*(v.m[j]-tg)-5.2*v.mv[j])*h;v.m[j]+=v.mv[j]*h;}
    }
    if(!REDUCED.matches){const j=2+((Math.random()*6)|0);v.mv[j]+=(Math.random()-.5)*.9*dt*(v.hover?3:1);}
    let tot=0;for(let j=0;j<8;j++)tot+=Math.abs(v.m[j]);if(tot>.42){const f=.42/tot;for(let j=0;j<8;j++)v.m[j]*=f;}
    const tgt=v.pop?1.45:(n===S.sel?1.12:1)*(v.hover?1.06:1)*(v.drag?1.16:1);
    if(v.born>-9&&PADT<v.born){v.rs=0;}
    else{v.rsv+=((tgt-v.rs)*260-v.rsv*15)*dt;v.rs+=v.rsv*dt;}
    for(const rp of RIPS){
      const age=PADT-rp.t0;if(age>2.2)continue;const d=Math.hypot(v.x-rp.x,v.y-rp.y);
      if(!v.hit.has(rp)&&Math.abs(d-age*.85)<.03&&d>.02){v.hit.add(rp);poke(n,Math.atan2(rp.y-v.y,rp.x-v.x),.35*rp.a*Math.exp(-age*1.5));}
    }
    const ord=FLOW&&FLOW.order[n.id]!=null?FLOW.order[n.id]:0;
    let mod=0;for(const r of MOD.routes)if(r.k.startsWith(pre(n)))mod+=Math.abs(r.d*MOD.val[r.s]);
    const bph=(((beat-ord*.12)%1)+1)%1,pulse=Math.exp(-bph*5);
    const on=isOn(n);
    v.act+=(((on?1:.25)*(.18+.5*pulse+Math.min(.6,mod*1.4)))-v.act)*Math.min(1,dt*10);
    if(v.kick){splash(n,.7);v.kick=0;}
  }
  if(DRAG&&DRAG.moved){
    const a=DRAG.n;
    for(const n of S.nodes){if(n===a||!n.vis||n.vis.pop)continue;const v=n.vis,dx=v.x-a.vis.x,dy=v.y-a.vis.y,d=Math.hypot(dx,dy),lim=BUB_R*2.2;
      if(d<lim&&d>1e-4){const f=(lim-d)*30;v.vx+=dx/d*f*dt*60;v.vy+=dy/d*f*dt*60;if(!v.bump){poke(n,Math.atan2(-dy,-dx),.5);v.bump=1;}}else v.bump=0;}
  }
  for(let i=RIPS.length-1;i>=0;i--)if(PADT-RIPS[i].t0>2.6)RIPS.splice(i,1);
}

function renderPad(){

  const A=ARR;A.ring.fill(0);
  for(let i=0;i<6;i++){A.ring[i*4]=RING_R[i];A.ring[i*4+1]=FLOW&&FLOW.act.includes(i)?1:0;A.ring[i*4+2]=FLOW&&FLOW.hiRing===i?.55+.45*Math.sin(PADT*7):0;}

    A.b.set([v.x,v.y,BUB_R*Math.max(0,v.rs)*breathe,alpha],i*4);

    A.m1.set([v.m[0],v.m[1],v.m[2],v.m[3]],i*4);A.m2.set([v.m[4],v.m[5],v.m[6],v.m[7]],i*4);
    const removing=v.drag&&DRAG&&DRAG.moved&&DRAG.ring<0;
    let dh=hexHue(nodeTint(n))-BASE_HUE;dh=((dh+540)%360)-180;A.hue[i]=dh*Math.PI/180;
    A.bs.set([n===S.sel?1:0,v.hover?1:0,removing?2:v.drag?1:0,isOn(n)?0:1],i*4);
  });
  A.rip.fill(0);RIPS.forEach((r,i)=>A.rip.set([r.x,r.y,r.t0,r.a],i*4));
  if(PAD.mode==='gl'){
    const gl=PAD.gl,u=PAD.u;gl.viewport(0,0,PAD.W,PAD.W);
    gl.uniform2f(u.uRes,PAD.W,PAD.W);gl.uniform1f(u.uT,PADT);gl.uniform1f(u.uPx,2/PAD.W);gl.uniform1f(u.uFlow,REDUCED.matches?.25:1);
    gl.uniform1f(u.uAny,FLOW&&FLOW.act.length?1:0);
    gl.uniform4fv(u.uRing,A.ring);gl.uniform1i(u.uSegN,segs.length);gl.uniform4fv(u.uSeg,A.seg);
    gl.uniform1i(u.uFeedN,feeds.length);gl.uniform4fv(u.uFeed,A.feed);
    gl.uniform1i(u.uBubN,list.length);gl.uniform4fv(u.uB,A.b);gl.uniform4fv(u.uBC,A.bc);gl.uniform4fv(u.uBM1,A.m1);gl.uniform4fv(u.uBM2,A.m2);gl.uniform4fv(u.uBS,A.bs);
    gl.uniform4fv(u.uRip,A.rip);gl.uniform1fv(u.uBH,A.hue);
    gl.drawArrays(gl.TRIANGLES,0,3);

/* simple canvas fallback when WebGL 2 is unavailable */

    L.style.setProperty('--c',nodeTint(n));L.style.setProperty('--rc',RING_COL[ring]||'#fff');
    const r=BUB_R*Math.max(0,v.rs);

/* direction chevrons on each path segment (Input → nodes → Output) and a tag on each Portal return arc */
const FM={flow:null,css:0,host:null,pool:[]};
function updateFlowMarks(){
  const css=PAD.css||1;
  if(FM.flow===FLOW&&FM.css===css)return;
  FM.flow=FLOW;FM.css=css;
  if(!FM.host){FM.host=el('<div class="pflow" aria-hidden="true"></div>');$('#plabels').prepend(FM.host);}
  const marks=[];
  for(const s of (FLOW?FLOW.segs:[])){
    const lvl=s[3],R=RING_R[s[0]]-.045*lvl,mid=s[1]+s[2]/2;
    if(Math.abs(s[2])*R<(lvl?.12:2.6*BUB_R))continue;      /* no room between two bubbles */
    const sg=Math.sign(s[2])||1,tx=-Math.sin(mid)*sg,ty=Math.cos(mid)*sg;
    marks.push({x:R*Math.cos(mid),y:R*Math.sin(mid),rot:Math.atan2(ty,tx)*180/Math.PI,c:lvl?'#f2e9ff':RING_COL[s[0]],loop:!!lvl});
  }
  while(FM.pool.length<marks.length){const m=el('<span class="chev"></span>');FM.host.append(m);FM.pool.push(m);}
  FM.pool.forEach((m,i)=>{
    const k=marks[i];m.hidden=!k;if(!k)return;
    m.classList.toggle('loop',k.loop);m.style.setProperty('--c',k.c);
    m.style.transform=`translate(${((k.x*.5+.5)*css).toFixed(1)}px,${((k.y*.5+.5)*css).toFixed(1)}px) translate(-50%,-50%) rotate(${k.rot.toFixed(1)}deg)`;
  });
}
function updatePadInfo(){
  const a=activeRings();const st=a.filter(i=>!S.paths[i]).length,mid=a.filter(i=>S.paths[i]===1).length,side=a.filter(i=>S.paths[i]===2).length;
  const g=gainComp(st+Math.max(mid,side));
  const loops=pairIds().filter(p=>portalSpan(p)).length;
  $('#padinfo').innerHTML=a.length?`<b>${a.length===1?'1 path':a.length+' parallel paths'}</b> · each runs left → right · auto gain ${g?g.toFixed(1)+' dB':'0 dB'}${loops?` · ${loops} ${loops===1?'loop':'loops'}`:''}`:'No nodes · press Add node below';
  $('#padinfo').title='Each ring is its own path (A to F); paths run side by side and are summed at the output. On a ring, nodes process in order from left to right (A1, A2 …). How far apart they sit makes no difference.';

/* ---------- pointer interaction ---------- */
function padPoint(e){const r=PAD.cv.getBoundingClientRect();const R=r.width/2;return {x:(e.clientX-r.left-R)/R,y:(e.clientY-r.top-R)/R,R};}
function hitBubble(p){
  const list=live().filter(n=>n.vis).slice().reverse();
  let best=null,bd=9;
  for(const n of list){const v=n.vis,d=Math.hypot(p.x-v.x,p.y-v.y),lim=Math.max(BUB_R*v.rs*1.25,22/p.R);if(d<lim&&d<bd){bd=d;best=n;}}
  return best;
}
function nearestRing(r){let bi=0,bd=9;RING_R.forEach((R,i)=>{const d=Math.abs(r-R);if(d<bd){bd=d;bi=i;}});return bi;}
function bindPadInput(){
  const cv=PAD.cv;
  cv.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;const p=padPoint(e);const n=hitBubble(p);
    if(n){
      e.preventDefault();cv.setPointerCapture(e.pointerId);
      DRAG={n,id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false,ring:n.ring,ang:n.ang,ox:p.x-n.vis.x,oy:p.y-n.vis.y};
      if(S.sel!==n)select(n);
      poke(n,Math.atan2(p.y-n.vis.y,p.x-n.vis.x),.75);spawnRipple(n.vis.x,n.vis.y,.45);
    }else{spawnRipple(p.x,p.y,.8);}
  });
  cv.addEventListener('pointermove',e=>{
    const p=padPoint(e);
    if(DRAG&&e.pointerId===DRAG.id){
      if(!DRAG.moved&&Math.hypot(e.clientX-DRAG.sx,e.clientY-DRAG.sy)>5){DRAG.moved=true;DRAG.n.vis.drag=true;cv.style.cursor='grabbing';}
      if(!DRAG.moved)return;
      const x=p.x-DRAG.ox,y=p.y-DRAG.oy,r=Math.hypot(p.x,p.y);
      DRAG.n.vis.dx=x;DRAG.n.vis.dy=y;
      const ring=r>1.04?-1:nearestRing(Math.hypot(x,y));
      const ang=Math.atan2(y,x);
      if(ring!==DRAG.ring||Math.abs(wrapA(ang-DRAG.ang))>.01){DRAG.ring=ring;DRAG.ang=ang;FLOW_DIRTY=true;}
      $('#drophint').classList.toggle('on',ring<0);
      return;
    }
    const n=hitBubble(p);
    if(n!==HOVER){if(HOVER&&HOVER.vis)HOVER.vis.hover=false;HOVER=n;if(n){n.vis.hover=true;poke(n,Math.atan2(p.y-n.vis.y,p.x-n.vis.x),.18);}}
    cv.style.cursor=n?'grab':'default';
  });
  const end=e=>{
    if(!DRAG||e.pointerId!==DRAG.id)return;
    const D=DRAG;DRAG=null;D.n.vis.drag=false;$('#drophint').classList.remove('on');cv.style.cursor='default';
    if(D.moved){
      if(D.ring<0){removeNode(D.n);}
      else{
        const n=D.n;n.ring=D.ring;n.ang=D.ang;
        for(const m of partnerOf(n))if(m.ring!==D.ring){m.ring=D.ring;m.ang=freeAngle(D.ring);}
        relaxRing(D.ring,n);fixPortalOrder();splash(n,1);spawnRipple(n.vis.x,n.vis.y,1);DIRTY=true;
        emit('graph');emit('select');
      }
    }
    FLOW_DIRTY=true;
  };
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',()=>{if(HOVER&&HOVER.vis)HOVER.vis.hover=false;HOVER=null;});
}

      const tabs=el('<div class="ptabs" role="tablist" aria-label="Control pages"></div>');
      for(const pg of pages){
        const b=el(`<button class="ptab" type="button" role="tab" aria-selected="${pg.id===cur}">${esc(pg.label)}</button>`);
        b.addEventListener('click',()=>{if(PAGE_MEM[mem]===pg.id)return;PAGE_MEM[mem]=pg.id;renderPanel();});
        tabs.append(b);
      }
      tabs.addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const i=pages.findIndex(p=>p.id===cur);const j=(i+(e.key==='ArrowRight'?1:-1)+pages.length)%pages.length;PAGE_MEM[mem]=pages[j].id;renderPanel();requestAnimationFrame(()=>{const tb=$$('#nodebay .ptab')[j];if(tb)tb.focus();});});
      bay.append(tabs);
    }
    const host=el('<div class="ppage" role="tabpanel"></div>');bay.append(host);
    pages.find(p=>p.id===cur).build(host);
    /* short rows get bigger knobs; a page that would scroll steps its knobs down */
    host.querySelectorAll('.krow').forEach(r=>{if(r.children.length<=4)r.classList.add('few');});
    if(host.scrollHeight>host.clientHeight+6)host.classList.add('dense');
  }finally{SCOPE=null;}
}

function panelHead(n){

  tools.append(tog(K(n,'on'),{label:'On',color:tint}),rm);
  const pr=el(`<div class="nb-path"><span class="lab">PATH</span></div>`);

  return [h,pr];
}

/* ---------- Space: impulse response display ---------- */
function irPeaks(ir,custom){
  if(custom)return custom.peaks;
  const seed=[...ir.name].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);const r=mulberry32(seed);const N=520,a=new Float32Array(N);
  const tone=1-ir.dens;

    const noise=(r()*2-1)*ir.dens,sine=Math.sin(i*(.35+ir.bright*1.4))*tone*(.6+.4*Math.sin(i*.031));

  return a;
}
/* spec 4.2 C.2: E_in = min(1, k / (A M))^2, E_out = exp(-6.9077 k / (D M)) */
const irEnv=(u,A,D)=>Math.pow(Math.min(1,u/Math.max(1e-4,A)),2)*Math.exp(-6.9077*u/Math.max(.01,D));
function drawIR(n,sc,ir){
  const {w,h,d}=fitCanvas(sc.cv);const x=sc.cv.getContext('2d');x.clearRect(0,0,w,h);gridBG(x,w,h,10,4);
  const pk=irPeaks(ir,n.x.custom);
  const s0=modV(K(n,'irStart'))/100,s1=Math.max(s0+.05,modV(K(n,'irEnd'))/100);
  const st=modV(K(n,'stretch'))/100,A=modV(K(n,'attack'))/100,D=modV(K(n,'decay'))/100,rev=V(K(n,'reverse'));
  const mid=h/2,amp=h*.42,N=pk.length,X=i=>i/(N-1)*w;

    if(inside){const u=(t-s0)/(s1-s0);const src=rev?s1-u*(s1-s0):s0+u*(s1-s0);v=pk[clamp(Math.round(src*(N-1)),0,N-1)]*irEnv(u,A,D);}
    else v=pk[i];

    const av=Math.sqrt(Math.abs(v));x.beginPath();x.moveTo(X(i),mid-av*amp);x.lineTo(X(i),mid+av*amp*.85);x.stroke();
  }

  x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=1.2*d;x.beginPath();
  for(let k=0;k<=120;k++){const u=k/120;const X0=(s0+u*(s1-s0))*w,Y0=h-(h*.9)*irEnv(u,A,D)-2*d;k?x.lineTo(X0,Y0):x.moveTo(X0,Y0);}x.stroke();
  for(const [p,lb] of [[s0,'S'],[s1,'E']]){x.fillStyle='#94e8ff';x.fillRect(p*w-1*d,0,2*d,h);x.beginPath();x.arc(p*w,h*.5,6*d,0,TAU);x.fill();x.fillStyle='#04070a';x.font=`${9*d}px "Share Tech Mono",monospace`;x.textAlign='center';x.textBaseline='middle';x.fillText(lb,p*w,h*.5+.5);}

}

/* ---------- Filter response ---------- */
const FS=48000;
function biq(type,f0,Q,gdb){
  const A=Math.pow(10,gdb/40),w0=TAU*f0/FS,c=Math.cos(w0),s=Math.sin(w0),al=s/(2*Q);let b0,b1,b2,a0,a1,a2;

    case 0:b0=(1-c)/2;b1=1-c;b2=(1-c)/2;a0=1+al;a1=-2*c;a2=1-al;break;
    case 1:b0=(1+c)/2;b1=-(1+c);b2=(1+c)/2;a0=1+al;a1=-2*c;a2=1-al;break;
    case 2:b0=al;b1=0;b2=-al;a0=1+al;a1=-2*c;a2=1-al;break;
    case 3:b0=1+al*A;b1=-2*c;b2=1-al*A;a0=1+al/A;a1=-2*c;a2=1-al/A;break;
    case 4:{const sq=2*Math.sqrt(A)*al;b0=A*((A+1)-(A-1)*c+sq);b1=2*A*((A-1)-(A+1)*c);b2=A*((A+1)-(A-1)*c-sq);a0=(A+1)+(A-1)*c+sq;a1=-2*((A-1)+(A+1)*c);a2=(A+1)+(A-1)*c-sq;break;}
    case 5:{const sq=2*Math.sqrt(A)*al;b0=A*((A+1)+(A-1)*c+sq);b1=-2*A*((A-1)+(A+1)*c);b2=A*((A+1)+(A-1)*c-sq);a0=(A+1)-(A-1)*c+sq;a1=2*((A-1)-(A+1)*c);a2=(A+1)-(A-1)*c-sq;break;}
    default:b0=1;b1=-2*c;b2=1;a0=1+al;a1=-2*c;a2=1-al;
  }
  return [b0/a0,b1/a0,b2/a0,a1/a0,a2/a0];
}
function magAt(co,f){const w=TAU*f/FS,cr=Math.cos(w),ci=-Math.sin(w),c2r=Math.cos(2*w),c2i=-Math.sin(2*w);
  const nr=co[0]+co[1]*cr+co[2]*c2r,ni=co[1]*ci+co[2]*c2i,dr=1+co[3]*cr+co[4]*c2r,di=co[3]*ci+co[4]*c2i;return Math.sqrt((nr*nr+ni*ni)/(dr*dr+di*di));}
/* spec 4.3 C.3 vowel table A, E, I, O, U */
const VOWELS=[[800,1150,2900],[350,2000,2800],[270,2140,2950],[450,800,2830],[325,700,2700]];
/* spec type order -> display biquad: LP, HP, BP, Notch, Peak(bell), Lo Shelf, Hi Shelf */
const BIQ_OF=[0,1,2,6,3,4,5];
/* BP / Formant makeup: 60 % of the pink-noise loss of the band, at most +6 dB (same sum as FilterNode::bandPassLossDb) */
function bandPassLossDb(Q,S){
  const qs=Math.pow(Math.max(Q,.05),1/S);let e=0;const N=240;
  for(let j=0;j<N;j++){const u=.02*Math.pow(1000,(j+.5)/N),a=u/qs,d=1-u*u;e+=Math.pow(a*a/(d*d+a*a),S);}
  return -10*Math.log10(Math.max(e/N,1e-12));
}
const filterMakeupDb=(type,Q,S)=>Math.min(6,type===2?.6*bandPassLossDb(clamp(Q,.25,100),clamp(S,1,8)):type===7?.6*Math.max(0,bandPassLossDb(clamp(2*Q,.25,100),1)-2.967):0);
function filterDB(type,fc,Q,slope,gain,f){
  if(type===7){const p=clamp(fc/4000*4,0,4),i=Math.min(3,Math.floor(p)),t=p-i;let s=0;
    for(let k=0;k<3;k++){const ff=lerp(VOWELS[i][k],VOWELS[i+1][k],t);s+=magAt(biq(2,ff,Q*2,0),f)*(k?.7:1);}return 20*Math.log10(s+1e-6)+filterMakeupDb(7,Q,1);}
  if(type===8){const D=FS/fc,g=.85,w=TAU*f/FS*D;return clamp(-10*Math.log10(1-2*g*Math.cos(w)+g*g)-10.46,-40,40);}

  const S_=Math.max(1,slope),qs=Math.pow(Q,1/S_);

}
function filterCuts(n){
  const fc=modV(K(n,'cutoff')),st=modV(K(n,'stOff')),m=V(K(n,'stMod'))/100;
  const wob=m?12*m*Math.sin(TAU*.25*PADT):0;
  return {fc,L:clamp(fc*Math.pow(2,-(st+wob*2)/24),20,20000),R:clamp(fc*Math.pow(2,(st+wob*2)/24),20,20000),off:Math.abs(st)+Math.abs(wob)>.25};
}
function drawFilter(n,sc){
  const {w,h,d}=fitCanvas(sc.cv);const x=sc.cv.getContext('2d');x.clearRect(0,0,w,h);

  x.fillStyle='rgba(148,232,255,.3)';x.font=`${9*d}px "Share Tech Mono",monospace`;x.textBaseline='bottom';
  for(const [f,l] of [[100,'100'],[1000,'1k'],[10000,'10k']])x.fillText(l,fx(f)+3*d,h-3*d);

  sc.capR.textContent=type===7?'Vowel '+'AEIOU'[Math.min(4,Math.floor(fc/1000))]:off?`L ${F.hz(L)} · R ${F.hz(R)}`:V(K(n,'snap'))?hzNote(fc):F.hz(fc);

function filterInput(n,cv){

/* ---------- Haze: dispersion chirp scope ---------- */
function drawHaze(n,sc){

/* ---------- Grains: live grain cloud ---------- */
const hash01=k=>{const v=Math.sin(k*12.9898+78.233)*43758.5453;return v-Math.floor(v);};
function grainWin(u,sh){                     /* Perc -> Hann -> Tukey, as GrainsNode morphs them */
  const hann=.5-.5*Math.cos(TAU*u);
  if(sh<.5){const perc=Math.min(1,u*25)*Math.exp(-u*5.5),k=sh/.5;return perc*(1-k)+hann*k;}
  const k=(sh-.5)/.5,a=Math.max(.08,1-.84*k);
  const tk=u<a/2?.5-.5*Math.cos(TAU*u/a):u>1-a/2?.5-.5*Math.cos(TAU*(1-u)/a):1;
  return hann*(1-k)+tk*k;
}
function drawGrains(n,sc){
  const {w,h,d}=fitCanvas(sc.cv);const x=sc.cv.getContext('2d');x.clearRect(0,0,w,h);gridBG(x,w,h,12,4);
  const rate=V(K(n,'sync'))?1/beatSec(V(K(n,'rateDiv'))):modV(K(n,'rate'));
  const size=modV(K(n,'size'))/1000,sr=modV(K(n,'sizeRand'))/100,rr=modV(K(n,'rateRand'))/100,sh=modV(K(n,'shape'))/100;
  const spray=modV(K(n,'spray'))/1000,pitch=modV(K(n,'pitch')),view=1.6,step=1/Math.max(.5,rate);
  const tint=T.grains.tint,now=PADT;
  const first=Math.floor((now-view-size*2)/step),last=Math.ceil(now/step);
  const top=22*d,bot=h-8*d,spreadF=Math.min(1,spray/.6+.1),shift=Math.max(-1,Math.min(1,pitch/24))*.25;
  for(let k=Math.max(first,last-400);k<=last;k++){
    const t0=k*step+(hash01(k)-.5)*step*rr;
    const len=size*Math.pow(2,(hash01(k+.37)-.5)*2*sr);
    const X0=w*(1-(now-t0)/view),X1=X0+w*len/view;if(X1<0||X0>w)continue;
    const amp=(bot-top)*(.07+.06*hash01(k+.19));
    const c=.5-shift+(hash01(k+.71)-.5)*spreadF;               /* 0 top .. 1 bottom */
    const yc=top+amp+Math.max(0,Math.min(1,c))*(bot-top-2*amp);
    const segs=Math.max(8,Math.min(48,Math.round((X1-X0)/(3*d))));
    x.beginPath();
    for(let i=0;i<=segs;i++){const u=i/segs;const XX=X0+(X1-X0)*u,yy=yc-amp*grainWin(u,sh);i?x.lineTo(XX,yy):x.moveTo(XX,yy);}
    for(let i=segs;i>=0;i--){const u=i/segs;x.lineTo(X0+(X1-X0)*u,yc+amp*grainWin(u,sh));}
    x.closePath();
    const age=Math.max(0,Math.min(1,(X0+(X1-X0)/2)/w));           /* newest grains (right) brightest */
    x.globalAlpha=.10+.22*age;x.fillStyle=tint;x.fill();
    x.globalAlpha=.35+.6*age;x.strokeStyle=tint;x.lineWidth=1.1*d;x.stroke();
  }
  x.globalAlpha=1;
  sc.cap.textContent=`grain cloud · ${F.hz(rate)} · ${Math.round(size*1000)} ms`;
  sc.capR.textContent=`spray ${Math.round(spray*1000)} ms`;
}

/* ---------- echo train (Portals loop, Grains delay) ---------- */
function drawEcho(sc,dly,fb,first,lo,hi,tint,label){
  const {w,h,d}=fitCanvas(sc.cv);const x=sc.cv.getContext('2d');x.clearRect(0,0,w,h);gridBG(x,w,h,16,4);
  dly=Math.max(.02,dly);const span=Math.max(dly*8,1.2),base=h-14*d,top=18*d,colW=Math.max(3*d,Math.min(10*d,w*dly/span*.18));
  const lvl=g=>Math.max(0,1+20*Math.log10(Math.max(g,1e-6))/48);           /* 48 dB scale */
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=1*d;x.beginPath();x.moveTo(0,base+.5);x.lineTo(w,base+.5);x.stroke();
  const pts=[];let g=1;
  for(let k=0;k*dly<=span;k++){
    if(k===1)g=first;else if(k>1)g*=fb;

function tapTimes(n){

  const s=modV(K(n,'skew'))/100,g=Math.pow(3,s),sw=modV(K(n,'swing'))/100,fd=modV(K(n,'fade'))/100,pp=modV(K(n,'pingpong'))/100;

/* =========================================================
   Modulation: 3 vector LFOs, envelope follower, macro, routing
   ========================================================= */
/* point format [x, y, c]: y is 0..1 (unipolar), c is the tension of the segment that starts at this point */
const SHAPES={
  sine:{pts:[[0,.5,0],[.25,1,0],[.5,.5,0],[.75,0,0],[1,.5,0]],smooth:1},
  tri:{pts:[[0,0,0],[.5,1,0],[1,0,0]],smooth:0},
  saw:{pts:[[0,1,0],[1,0,0]],smooth:0},
  ramp:{pts:[[0,0,0],[1,1,0]],smooth:0},
  exp:{pts:[[0,1,-5],[1,0,0]],smooth:0},
  square:{pts:[[0,1,0],[.5,1,0],[.5,0,0],[1,0,0]],smooth:0},
  /* rhythm shapes (mirrored in Patch.cpp namedLfoShape; ui_bridge_check compares them) */
  womp:{pts:[[0,0,2],[.32,1,-1.5],[.9,0,0],[1,0,0]],smooth:0},          // future-bass wobble: eased open, long close
  pump:{pts:[[0,0,-3.5],[.62,1,0],[.96,1,0],[1,0,0]],smooth:0},         // sidechain recovery: 0 on the beat, swells back
  bounce:{pts:[[0,1,2.5],[.34,0,-2.5],[.55,.6,2.5],[.72,0,-2.5],[.83,.32,2.5],[.92,0,-2.5],[.96,.14,2.5],[1,0,0]],smooth:0}
};
/* gate: 8 steps (x . x x . x . x), 55 % duty; stutter: ratcheting decays 1/4 1/4 1/8 1/8 1/16 ×4 of the cycle */
SHAPES.gate=(()=>{const on=[1,0,1,1,0,1,0,1],d=.55/8,pts=[];
  on.forEach((v,k)=>{if(!v)return;const a=k/8;if(!pts.length&&k===0)pts.push([0,1,0]);else{if(!pts.length)pts.push([0,0,0]);pts.push([a,0,0],[a,1,0]);}pts.push([a+d,1,0],[a+d,0,0]);});
  pts.push([1,0,0]);return {pts,smooth:0};})();
SHAPES.stutter=(()=>{const e=[0,.25,.5,.625,.75,.8125,.875,.9375,1],pts=[];
  for(let k=0;k<8;k++)pts.push([e[k],1,-2.5],[e[k+1],0,0]);return {pts,smooth:0};})();
const SHAPE_CHIPS=[['womp','Womp'],['pump','Pump'],['gate','Gate'],['bounce','Bnce'],['stutter','Stut'],['sine','Sin'],['tri','Tri'],['saw','Saw'],['square','Sqr'],['sh','S&H'],['rnd','Rnd']];
const normPts=pts=>(pts||[]).map(p=>[+p[0],clamp(+p[1],0,1),clamp(+(p[2]||0),-10,10)]);
/* shapes saved before the spec alignment were bipolar (-1..1) */
const fixPts=(pts,bip)=>{bip=bip!=null?bip:(pts||[]).some(p=>p[1]<0);return normPts((pts||[]).map(p=>[p[0],bip?(p[1]+1)/2:p[1],p[2]||0]));};
/* r: random source for the 'sh' / 'rnd' shapes (presets pass a seeded one so they load the same every time) */
function setShape(i,name,r=Math.random){
  const L=MOD.lfo[i];
  if(name==='sh'){const s=8;L.pts=[];for(let k=0;k<s;k++){const y=+r().toFixed(3);L.pts.push([k/s,y,0],[(k+1)/s-.0001,y,0]);}L.pts[L.pts.length-1][0]=1;L.smooth=0;}
  else if(name==='rnd'){L.pts=[[0,.5,0]];for(let k=1;k<7;k++)L.pts.push([k/7,+(r()*.9+.05).toFixed(3),0]);L.pts.push([1,.5,0]);L.smooth=1;}
  else{const s=SHAPES[name]||SHAPES.sine;L.pts=s.pts.map(p=>p.slice());L.smooth=s.smooth;}
  DIRTY=true;
}
/* "magic" generator: musically shaped random curves built from tension segments */
function magicShape(i){
  const L=MOD.lfo[i],kind=pick(['pump','stairs','swell','bounce','glitch','arc']);
  let pts=[];L.smooth=0;
  if(kind==='pump'){const k=pick([1,2,4]);for(let j=0;j<k;j++){const a=j/k,b=(j+1)/k;pts.push([a,0,0],[a+.02/k,1,rnd(-7,-3)],[b-.0001,.12,0]);}pts.push([1,0,0]);}
  else if(kind==='stairs'){const k=pick([4,6,8]);const ys=Array.from({length:k},(_,j)=>j/(k-1));if(RNG()<.5)ys.reverse();for(let j=0;j<k;j++){pts.push([j/k,ys[j],0],[(j+1)/k-.0001,ys[j],0]);}pts[pts.length-1][0]=1;}
  else if(kind==='swell'){pts=[[0,0,rnd(2,5)],[rnd(.45,.75),rnd(.8,1),rnd(-4,-1)],[rnd(.8,.92),rnd(.3,.6),0],[1,0,0]];}
  else if(kind==='bounce'){const k=pick([3,4,5]);for(let j=0;j<=k;j++)pts.push([j/k,j%2?rnd(0,.15):1-j/k*rnd(.4,1),j%2?rnd(-4,-2):rnd(2,4)]);}

/* spec 5.1 VectorLFO: g(u,c) = (e^{cu}-1)/(e^c-1), linear when |c| < 1e-3 */
const tens=(u,c)=>Math.abs(c)<1e-3?u:(Math.exp(c*u)-1)/(Math.exp(c)-1);

  const p=L.pts;if(!p.length)return 0;x=((x%1)+1)%1;
  let i=0;while(i<p.length-1&&p[i+1][0]<x)i++;
  if(i>=p.length-1)return p[p.length-1][1];
  const a=p[i],b=p[i+1];const span=b[0]-a[0];const t=span<=1e-6?1:(x-a[0])/span;
  if(!L.smooth)return a[1]+(b[1]-a[1])*tens(t,a[2]||0);
  /* Smooth (extra): Catmull-Rom through the points, tension ignored */
  const p0=p[Math.max(0,i-1)][1],p3=p[Math.min(p.length-1,i+2)][1];
  const t2=t*t,t3=t2*t;return clamp(.5*((2*a[1])+(-p0+b[1])*t+(2*p0-5*a[1]+4*b[1]-p3)*t2+(-p0+3*a[1]-3*b[1]+p3)*t3),0,1);

function lfoValue(i,x){
  const L=MOD.lfo[i],st=LFO_STEPS[V(`lfo${i+1}.step`)];
  const xx=st?Math.floor(x*st)/st:x;return evalLFO(L,xx);
}
const lfoHz=i=>V(`lfo${i+1}.sync`)?(V('g.bpm')/60)/DIVS[V(`lfo${i+1}.div`)].b:V(`lfo${i+1}.rate`);

/* simulated input so the envelope follower has something to follow */
const ENVS={lvl:0,hist:new Float32Array(240),inHist:new Float32Array(240),hi:0};
/* the detector band-pass (env.freq) weights a kick, snare and hat preview signal */
const bandW=(f0,fd)=>1/(1+Math.pow(Math.log2(f0/fd)/1.3,2));
function envInput(t){
  const beat=t*V('g.bpm')/60,fd=V('env.freq');
  if(V('env.sc')){const ph=beat%1;return Math.exp(-ph*9)*.95*bandW(60,fd)+.04;}
  const kick=Math.exp(-(beat%1)*7),snare=Math.exp(-(((beat+1)%2)/2)*14)*((beat+1)%2<1?1:0),hat=Math.exp(-((beat*4)%1)*16);
  return clamp(kick*bandW(60,fd)+snare*.8*bandW(1500,fd)+hat*.7*bandW(9000,fd)+.05+.04*Math.sin(t*.7),0,1);
}
function stepMod(dt){
  if(HOST.hosted&&BRIDGE.meters){BRIDGE.applyMeters(dt);return;}
  for(let i=0;i<3;i++){
    const L=MOD.lfo[i];const prev=L.ph;L.ph+=dt*lfoHz(i);
    if(Math.floor(L.ph)!==Math.floor(prev))L.jit=V(`lfo${i+1}.rnd`)?(Math.random()*2-1)*.3:0;
    L.out=clamp(lfoValue(i,L.ph%1)+(V(`lfo${i+1}.rnd`)?L.jit*Math.sin(Math.PI*(L.ph%1)):0),0,1);
    MOD.val['lfo'+(i+1)]=L.out;
  }
  const inp=clamp(envInput(PADT)*Math.pow(10,V('env.gain')/20)*.5,0,1);
  const tc=(inp>ENVS.lvl?V('env.atk'):V('env.rel'))/1000;
  ENVS.lvl+=(inp-ENVS.lvl)*(1-Math.exp(-dt/Math.max(.0005,tc)));

  while(ENVS.acc>1/60){ENVS.acc-=1/60;ENVS.hist.copyWithin(0,1);ENVS.hist[239]=ENVS.lvl;ENVS.inHist.copyWithin(0,1);ENVS.inHist[239]=inp;}
  MOD.val.macro=V('g.macro')/100;
}

    x.beginPath();for(let k=0;k<=W;k+=d){const t=k/W;const v=lfoValue(i,Math.min(t,.99999));k?x.lineTo(X(t),Y(v)):x.moveTo(X(t),Y(v));}

function lfoEditInput(cv){
  const pos=e=>{const r=cv.getBoundingClientRect();const pad=10*r.width/Math.max(1,cv.offsetWidth);return {t:clamp((e.clientX-r.left-pad)/(r.width-pad*2),0,1),v:clamp(1-(e.clientY-r.top-pad)/(r.height-pad*2),0,1),r,pad};};
  const snap=(i,t,v)=>{if(V(`lfo${i+1}.grid`)){t=Math.round(t*16)/16;v=Math.round(v*8)/8;}return [t,v];};
  const px=(p,t,v)=>[(p.pad+t*(p.r.width-2*p.pad)),(p.pad+(1-v)*(p.r.height-2*p.pad))];
  cv.addEventListener('pointerdown',e=>{
    if(!S.src.startsWith('lfo'))return;const i=+S.src[3]-1,L=MOD.lfo[i];const p=pos(e);
    const mx=e.clientX-p.r.left,my=e.clientY-p.r.top,lim=14*Math.max(.6,UI_SCALE);
    let j=-1,bd=1e9;L.pts.forEach((pt,k)=>{const [a,b]=px(p,pt[0],pt[1]);const d=Math.hypot(a-mx,b-my);if(d<bd){bd=d;j=k;}});
    /* tension handle at each segment midpoint (spec c_i), unless Smooth is on */
    let hj=-1,hd=1e9;if(!L.smooth)for(let k=0;k<L.pts.length-1;k++){const a=L.pts[k],b=L.pts[k+1];if(b[0]-a[0]<.012||Math.abs(b[1]-a[1])<.02)continue;const [hx,hy]=px(p,(a[0]+b[0])/2,a[1]+(b[1]-a[1])*tens(.5,a[2]||0));const d=Math.hypot(hx-mx,hy-my);if(d<hd){hd=d;hj=k;}}
    const now=performance.now();
    if(hj>=0&&hd<lim&&hd<bd){
      if(LFO_LAST.c===hj&&now-LFO_LAST.t<320){L.pts[hj][2]=0;LFO_LAST={t:0,i:-1};DIRTY=true;return;}
      LFO_LAST={t:now,i:-1,c:hj};LFO_DRAG={i,c:hj,y:e.clientY,c0:L.pts[hj][2]||0};
    }else if(j>=0&&bd<lim){
      if(LFO_LAST.i===j&&now-LFO_LAST.t<320&&j>0&&j<L.pts.length-1){L.pts.splice(j,1);LFO_LAST={t:0,i:-1};DIRTY=true;return;}
      LFO_LAST={t:now,i:j};LFO_DRAG={i,j};
    }else{
      if(L.pts.length>=32){toast('An LFO holds up to 32 points');return;}
      const [t,v]=snap(i,p.t,p.v);let k=L.pts.findIndex(pt=>pt[0]>t);if(k<0)k=L.pts.length;if(k===0)k=1;
      L.pts.splice(k,0,[t,v,0]);LFO_DRAG={i,j:k};DIRTY=true;
    }
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove',e=>{
    if(!LFO_DRAG)return;const L=MOD.lfo[LFO_DRAG.i];
    if(LFO_DRAG.c!=null){const a=L.pts[LFO_DRAG.c],b=L.pts[LFO_DRAG.c+1];if(!b)return;const r=cv.getBoundingClientRect();const up=(LFO_DRAG.y-e.clientY)/r.height;
      a[2]=+clamp(LFO_DRAG.c0-up*24*Math.sign(b[1]-a[1]||1),-10,10).toFixed(2);DIRTY=true;return;}
    const j=LFO_DRAG.j;const p=pos(e);let [t,v]=snap(LFO_DRAG.i,p.t,p.v);
    if(j===0)t=0;else if(j===L.pts.length-1)t=1;else t=clamp(t,L.pts[j-1][0],L.pts[j+1][0]);
    L.pts[j]=[+t.toFixed(4),+v.toFixed(3),L.pts[j][2]||0];DIRTY=true;
  });
  const end=()=>{LFO_DRAG=null;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.setAttribute('aria-label','LFO shape editor. Click to add a point, drag to move it, double-click a point to delete it. Drag a diamond up or down to bend that segment; double-click it to straighten.');
  cv.style.cursor='crosshair';
}

    const t=document.elementFromPoint(e.clientX,e.clientY);const k=t&&t.closest('.kn:not(.nomod)');
