  const load=async f=>{
    if(!f)return;drop.querySelector('b').textContent='Reading '+f.name+' …';
    try{
      const buf=await f.arrayBuffer();const ctx=new OfflineAudioContext(1,1,44100);const ab=await ctx.decodeAudioData(buf);
      const ch=ab.getChannelData(0),N=520,pk=new Float32Array(N),step=Math.max(1,Math.floor(ch.length/N));let mx=0;
      for(let i=0;i<N;i++){let m=0;for(let j=i*step;j<Math.min(ch.length,(i+1)*step);j++)m=Math.max(m,Math.abs(ch[j]));pk[i]=m;mx=Math.max(mx,m);}
      for(let i=0;i<N;i++)pk[i]/=mx||1;
      const custom={name:f.name.replace(/\.[^.]+$/,''),len:ab.duration,peaks:Array.from(pk,v=>+v.toFixed(3))};

      if(HOST.hosted)custom.key=BRIDGE.sendImpulse(ab,custom.name);

    }catch(e){drop.querySelector('b').textContent='That file could not be read as audio. Try a WAV or AIFF file.';}
  };
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));

}

/* ---------- legacy (pre-spec) patch migration ---------- */
const OLD_CHORDS=['Maj','Min','7','Maj7','Min7','Min7/9','m7b5','Dim7','Sus2','Sus4','Add9','6/9','Major scale','Minor scale','Dorian','Penta','Whole tone'];
const OLD_SLICES=[1,2,3,4,6,8,12,16];
const oldDiv=i=>{const l=OLD_DIVS[Math.round(i)];const j=l?DIV(l):-1;return j<0?DIV('1/8'):j;};
const RENAME={grains:{},space:{fadeIn:'attack',fadeOut:'decay'},portal:{time:'delay',timeDiv:'delayDiv',damp:'hiCut',safety:'gate'},bismuth:{sync:'arpSync'}};
function migrate(pr){
  if(!pr||pr.v>=2)return pr;
  pr=clone(pr);const out={v:2,name:pr.name,cat:pr.cat,note:pr.note,cluster:pr.cluster,paths:pr.paths,mix:pr.mix,macro:pr.macro,bpm:pr.bpm,nodes:[],pairs:{},routes:[]};
  if(pr.pt){const o=pr.pt;out.pairs.p1={delay:clamp(o.time??120,20,2000),delayDiv:o.timeDiv!=null?oldDiv(o.timeDiv):undefined,fb:o.fb,hiCut:clamp(o.damp??14000,1000,20000),sync:o.sync,gate:o.safety??1,on:o.on??1};}
  for(const d of pr.nodes||[]){
    const n={t:d.t,ring:d.ring,ang:d.ang,p:Object.assign({},d.p||{}),x:d.x?clone(d.x):undefined};const p=n.p;
    if(d.t==='portalIn'||d.t==='portalOut'){n.pair='p1';n.p={};out.nodes.push(n);continue;}
    switch(d.t){
      case 'grains':if(p.reverse!=null&&p.reverse<=1)p.reverse*=100;delete p.lohi;for(const k of ['rateDiv','delayDiv'])if(p[k]!=null)p[k]=oldDiv(p[k]);
        if(p.arp!=null)p.arp=[0,1,1,2,2,2,3,4,5,8][p.arp]??0;break;
      case 'space':{const fo=p.fadeOut,fi=p.fadeIn;p.decay=fo!=null?clamp(100-fo*.9,1,100):100;p.attack=Math.max(p.attack||0,fi||0);delete p.fadeIn;delete p.fadeOut;
        if(p.stretch!=null&&p.stretch<=4)p.stretch*=100;break;}
      case 'filter':if(p.type!=null)p.type=[0,1,2,4,5,6,3,7,8][p.type]??0;if(p.reso!=null)p.reso=.5+p.reso/100*11.5;if(p.drive!=null)p.drive=p.drive*.24;if(p.stOff!=null)p.stOff=p.stOff*.48;break;
      case 'haze':if(p.scale!=null&&p.scale<=100)p.scale=80*Math.pow(100,p.scale/100);if(p.spread!=null)p.spread=Math.min(200,p.spread*1.43);break;
      case 'volt':if(p.fbFreq!=null)p.fbFreq=clamp(p.fbFreq,30,4000);break;
      case 'time':{if(p.slices!=null)p.slices=OLD_SLICES[p.slices]??8;
        if(p.lenDiv!=null){const l=OLD_DIVS[p.lenDiv];p.lenDiv={'4 bar':7,'2 bar':5,'1 bar':3,'1/2':2,'1/4':1,'1/8':0}[l]??3;}
        if(p.window!=null)p.window=Math.min(250,p.window);
        const st=(n.x&&n.x.st)||[];n.x=Object.assign({order:Array.from({length:16},(_,i)=>i)},n.x||{});n.x.rev=Array.from({length:16},(_,i)=>st[i]===1?1:0);n.x.mute=Array.from({length:16},(_,i)=>st[i]===4?1:0);
        st.forEach((s,i)=>{if(s===2)p['sp'+i]=12;else if(s===3)p['sp'+i]=-12;});delete n.x.st;break;}
      case 'taps':if(p.pingpong!=null&&p.pingpong<=1)p.pingpong*=100;if(p.timeDiv!=null)p.timeDiv=oldDiv(p.timeDiv);
        if(n.x&&n.x.tab)n.x.tab=n.x.tab.map(t=>({m:[6,0,1,2,3,4,5][t.m]??0,f:+(440*Math.pow(2,(t.v||0)/12)).toFixed(3),on:t.on??1}));break;
      case 'bismuth':if(p.root!=null&&p.root<12)p.root=48+p.root;if(p.qual!=null){const nm=OLD_CHORDS[p.qual]==='Min7/9'?'Min9':OLD_CHORDS[p.qual];const j=CHORDS.findIndex(c=>c.n===nm);p.qual=j<0?6:j;}
        if(p.sync!=null){p.arpSync=p.sync;delete p.sync;}if(p.arpDiv!=null)p.arpDiv=oldDiv(p.arpDiv);if(p.tilt!=null)p.tilt=p.tilt*.12;if(p.q!=null)p.q=clamp(p.q/20,.5,40);
        if(p.low!=null)p.low=clamp(p.low,20,1000);if(p.high!=null)p.high=clamp(p.high,1000,20000);if(p.mRate!=null)p.mRate=Math.max(.1,p.mRate);break;
    }
    out.nodes.push(n);
  }
  out.lfo=(pr.lfo||[]).map(L=>{if(!L)return L;const o=Object.assign({},L);if(o.pts)o.pts=fixPts(o.pts,true);if(o.div!=null)o.div=oldDiv(o.div);return o;});
  out.env=pr.env?Object.assign({},pr.env):null;
  for(const r of pr.routes||[]){
    const t=r.n==='pt'?'portal':r.n==='g'?'g':pr.nodes[r.n]&&pr.nodes[r.n].t;if(!t)continue;
    const k=(RENAME[t]&&RENAME[t][r.k])||r.k;out.routes.push({s:r.s,n:r.n==='pt'?'p1':r.n,k,d:r.d});
  }
  return out;
}

function loadPreset(pr,o={}){
  pr=migrate(pr);
  const keepMix=o.keepMix!=null?o.keepMix:!!V('g.lock');
  const old=live();
  for(const n of old){n.vis.pop=PADT;}
  if(old.length)spawnRipple(0,0,1.4);
  for(const pid of pairIds(old))delPrefix(pid+'.');
  setTimeout(()=>{S.nodes=S.nodes.filter(n=>!old.includes(n));for(const n of old)if(!isPortal(n))delPrefix(n.id+'.');},330);
  MOD.routes=[];
  const pairMap={};let pc=0;S.pairSlots={};
  const made=(pr.nodes||[]).map((d,i)=>{
    const port=d.t==='portalIn'||d.t==='portalOut';
    if(port&&!pairMap[d.pair||'p1']){pairMap[d.pair||'p1']='p'+(++pc);const h=(pr.pairSlots||{})[d.pair||'p1'];if(h!=null)S.pairSlots['p'+pc]=h;}
    const pid=port?pairMap[d.pair||'p1']:null;
    const n=addNode(d.t,d.ring,d.ang,port?(pr.pairs||{})[d.pair||'p1']:d.p,port?null:d.x,{spawn:.1+i*.07,quiet:true,pair:pid});
    if(!port&&d.slot!=null)n.slot=d.slot;
    return n;
  });
  for(let i=0;i<6;i++)S.paths[i]=(pr.paths&&pr.paths[i])||0;
  if(!keepMix)setV('g.mix',pr.mix!=null?pr.mix:100,'load');
  setV('g.macro',pr.macro||0,'load');
  if(pr.bpm&&o.withTempo)setV('g.bpm',pr.bpm,'load');
  /* a preset fully defines the modulation sources: anything it leaves out gets its default,
     so a patch never inherits LFO/ENV settings from whatever was loaded before it */
  const seed=[...String(pr.name||'')].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);
  for(let i=0;i<3;i++){
    const L=(pr.lfo||[])[i]||{shape:'sine'};
    if(L.pts&&L.pts.length){MOD.lfo[i].pts=fixPts(L.pts,false);MOD.lfo[i].smooth=L.smooth?1:0;}
    else setShape(i,L.shape||'sine',mulberry32(seed+i*7919));
    for(const k of LFO_KEYS){const key=`lfo${i+1}.${k}`;setV(key,L[k]!=null?L[k]:P[key].s.def,'load');}
  }
  for(const k of ['atk','rel','freq','gain','sc']){const key='env.'+k,e=pr.env||{};setV(key,e[k]!=null?e[k]:P[key].s.def,'load');}
  for(const r of pr.routes||[]){
    const p=r.n==='g'?'g.':typeof r.n==='string'?(pairMap[r.n]?pairMap[r.n]+'.':null):made[r.n]?made[r.n].id+'.':null;
    if(p&&P[p+r.k]&&!P[p+r.k].s.nomod)MOD.routes.push({s:r.s,k:p+r.k,d:clamp(r.d,-1,1)});
  }
  for(const n of made)relaxRing(n.ring);
  fixPortalOrder();
  S.preset={name:pr.name,cat:pr.cat||'',src:o.src||'factory',cluster:pr.cluster};
  DIRTY=false;
  S.sel=made.find(n=>!isPortal(n))||made[0]||null;
  emit('graph');emit('select');emit('routes');emit('paths');emit('src');
  paintLCD();
}

        const f=b.add('filter',0,(a[1]+a[2])/2,{type:2,cutoff:nv('filter','cutoff',.5),reso:nv('filter','reso',.3)});

      b.l(0,pick(['tri','sine','exp']),{sync:1,div:pick([DIV('1/2'),DIV('1/4'),DIV('1/1')])});b.env={atk:rnd(2,10),rel:rnd(100,300),freq:rnd(300,2000),gain:rnd(4,10)};

/* spec 5.2 safety invariants */
function applyInvariants(b){
  const volts=b.nodes.filter(n=>n.t==='volt');
  if(volts.length){
    const heatN=Math.max(...volts.map(n=>V2N(T.volt.params.heat,n.p.heat??T.volt.params.heat.def)));
    const f=1-.6*heatN;
    for(const n of b.nodes){const k={grains:'fb',haze:'feedback',volt:'fbAmt',taps:'fb'}[n.t];if(k&&n.p[k]!=null)n.p[k]*=f;}
    for(const p of Object.values(b.pairs))if(p.fb!=null)p.fb*=f;
  }
  for(const n of b.nodes)if(n.t==='filter'&&(n.p.slope||1)>=3&&n.p.reso!=null)n.p.reso=Math.min(n.p.reso,4);
}
/* Poisson(5) routes drawn from the archetype's candidates, |d| <= 0.45, at least one macro route */
function sampleRoutes(b){
  const want=clamp(poisson(5),2,9),pool=b.cand.slice(),out=b.fixed.map(r=>Object.assign({},r));
  const take=i=>{const c=pool.splice(i,1)[0];const d=clamp(rnd(c.lo,c.hi),-.45,.45);out.push({s:c.s,n:c.n,k:c.k,d:+d.toFixed(3)});};
  const mi=pool.findIndex(c=>c.s==='macro');if(mi>=0)take(mi);
  while(out.length<want&&pool.length){const tot=pool.reduce((a,c)=>a+c.w,0);let r=RNG()*tot,i=0;for(;i<pool.length-1;i++){r-=pool[i].w;if(r<=0)break;}take(i);}
  b.routes=out;
}
function generate(){
  RNG=Math.random;
  const tot=ARCH.reduce((a,c)=>a+c.w,0);let r=Math.random()*tot,c=ARCH[0];for(const k of ARCH){r-=k.w;if(r<=0){c=k;break;}}
  const variant=c.variants?pick(c.variants):null;
  const b=B(`${pick(c.adj)} ${pick(c.noun)}`,'Generated',`${variant||c.name} archetype`);b.cluster=variant||c.name;
  c.build(b,variant);
  applyInvariants(b);sampleRoutes(b);
  for(let i=0;i<3;i++)if(!b.lfo[i])b.l(i,pick(['sine','tri','rnd']),{rate:rnd(.08,1.5),sync:RNG()<.5?1:0,div:pick([DIV('1/2'),DIV('1/4'),DIV('1/1')])});
  const pr=strip(b);pr.mix=V('g.mix');
  GEN_HIST.unshift(clone(pr));if(GEN_HIST.length>12)GEN_HIST.length=12;store.set('gen',GEN_HIST);
  loadPreset(pr,{src:'gen'});
}

/* ---------- LCD ---------- */
function paintLCD(){
  $('#pvTitle').innerHTML=esc(S.preset.name)+(DIRTY?'<i> *</i>':'');
  $('#pvSub').textContent=S.preset.src==='gen'?`Generated · ${S.preset.cluster||''}`:S.preset.src==='user'?'User preset':`Factory · ${S.preset.cat}`;
  fitLCD();
}
/* the name spreads across the screen; long names step down in spacing, then size, until they fit */
function fitLCD(){
  const b=$('#pvTitle');if(!b||!b.clientWidth)return;
  for(const [fs,ls] of [[29,.2],[29,.14],[27,.1],[24,.08],[21,.05]]){
    b.style.fontSize=fs+'px';b.style.letterSpacing=ls+'em';b.style.paddingLeft=ls+'em';
    if(b.scrollWidth<=b.clientWidth)break;
  }
}
function cyclePreset(dir){
  const list=S.preset.src==='user'?store.get('user',[]):S.preset.src==='gen'?GEN_HIST:FACTORY;
  if(!list.length)return;let i=list.findIndex(p=>p.name===S.preset.name);i=(i+dir+list.length)%list.length;
  loadPreset(list[i],{src:S.preset.src||'factory'});
}
/* =========================================================
   Top bar, wiring, session restore and the frame loop
   ========================================================= */
function buildTop(){
  const r=$('#topR');
  const bpm=el(`<button class="bpm" type="button" role="slider" aria-label="Tempo" aria-valuemin="40" aria-valuemax="220"><b class="mono"></b><span class="tiny">Tempo</span></button>`);
  const pb=()=>{bpm.querySelector('b').textContent=V('g.bpm').toFixed(V('g.bpm')%1?1:0);bpm.setAttribute('aria-valuenow',V('g.bpm'));bpm.setAttribute('aria-valuetext',V('g.bpm')+' BPM');};
  let d=null;
  bpm.addEventListener('pointerdown',e=>{d={y:e.clientY,v:V('g.bpm')};bpm.setPointerCapture(e.pointerId);});
  bpm.addEventListener('pointermove',e=>{if(d)setV('g.bpm',d.v+Math.round((d.y-e.clientY)/3)*(e.shiftKey?.5:1),'ui');});
  bpm.addEventListener('pointerup',()=>d=null);bpm.addEventListener('pointercancel',()=>d=null);
  bpm.addEventListener('dblclick',()=>setV('g.bpm',120,'ui'));
  bpm.addEventListener('keydown',e=>{const s=e.shiftKey?.5:1;if(e.key==='ArrowUp'||e.key==='ArrowRight')setV('g.bpm',V('g.bpm')+s,'ui');else if(e.key==='ArrowDown'||e.key==='ArrowLeft')setV('g.bpm',V('g.bpm')-s,'ui');else return;e.preventDefault();});
  bpm.addEventListener('wheel',e=>{e.preventDefault();setV('g.bpm',V('g.bpm')+(e.deltaY<0?1:-1),'ui');},{passive:false});
  onP('g.bpm',pb);pb();
  r.append(bpm,tog('g.lock',{label:'Mix Lock',color:'#94e8ff'}),knob('g.mix',{size:'sm',label:'Mix',color:'#2c3135',skin:'hero'}));
}
function wire(){
  $('#pvName').addEventListener('click',()=>openPresetWin());
  $('#pvPrev').addEventListener('click',()=>cyclePreset(-1));
  $('#pvNext').addEventListener('click',()=>cyclePreset(1));
  $('#pvSave').addEventListener('click',openSaveWin);
  $('#gen').addEventListener('click',()=>{const c=$('#gen');c.classList.remove('spin');void c.offsetWidth;c.classList.add('spin');generate();});
  $('#addnode').addEventListener('click',openNodeWin);
  onE('select',schedulePanel);onE('graph',schedulePanel);onE('paths',schedulePanel);
  document.addEventListener('keydown',e=>{
    if(WIN||e.target.closest('input,select,textarea,[role=slider]'))return;
    if((e.key==='Delete'||e.key==='Backspace')&&S.sel&&document.activeElement===document.body){removeNode(S.sel);}
  });
  const fit=()=>{
    const pg=$('.page'),st=$('#stage'),fr=$('#frame');
    const cs=getComputedStyle(pg),padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight),padY=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
    const rot=$('.rotate'),rh=rot&&rot.offsetHeight?rot.offsetHeight+10:0;
    const W=fr.offsetWidth,H=fr.offsetHeight;
    const s=Math.max(.2,Math.min((pg.clientWidth-padX)/W,(innerHeight-padY-rh)/H,1.35));
    UI_SCALE=s;fr.style.transform=`scale(${s})`;st.style.width=(W*s)+'px';st.style.height=(H*s)+'px';
  };
  fit();addEventListener('resize',fit);new ResizeObserver(fit).observe($('.page'));
}

/* session autosave so a reload keeps the patch */
let saveT=0;
function saveNow(){clearTimeout(saveT);if(HOST.hosted)return;try{store.set('session',{snap:snapshot(),preset:S.preset,dirty:DIRTY,src:S.src,bpm:V('g.bpm')});}catch(e){}}
function autosave(){clearTimeout(saveT);saveT=setTimeout(saveNow,600);}
addEventListener('pagehide',saveNow);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();});

function boot(){
  try{document.documentElement.style.setProperty('--brushed',`url(${brushedTex()})`);}catch(e){}
  try{bakeAssets();}catch(e){console.warn('bake',e);}
  FACTORY=buildFactory();
  buildTop();wire();initPad();buildModRail();
  BRIDGE.start();
  const hostState=HOST.hosted?HOST.init('pleromaState'):null;
  const sess=HOST.hosted?null:store.get('session',null);
  if(hostState&&hostState.nodes){
    try{BRIDGE.applyHostState(hostState,hostState.src||'user');}catch(e){console.warn(e);loadPreset(FACTORY[0],{keepMix:false});}
  }else if(sess&&sess.snap&&sess.snap.nodes){
    try{if(sess.bpm)setV('g.bpm',sess.bpm,'load');loadPreset(sess.snap,{src:sess.preset&&sess.preset.src,keepMix:false});S.preset=Object.assign({},sess.preset);DIRTY=!!sess.dirty;if(sess.src&&SRC[sess.src])S.src=sess.src;emit('src');}
    catch(e){console.warn(e);loadPreset(FACTORY[0],{keepMix:false});}
  }else loadPreset(FACTORY[0],{keepMix:false});
  paintLCD();
  /* repaint canvas text once the embedded fonts have decoded */
  try{document.fonts.ready.then(()=>{schedulePanel();});}catch(e){}
  onE('param',autosave);onE('graph',autosave);onE('routes',autosave);onE('paths',autosave);
  let last=performance.now(),lastDirty=DIRTY,acc=0;
  const frame=now=>{
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(!document.hidden){
      PADT+=dt;
      stepMod(dt);stepPad(dt);padQuality(dt);renderPad();drawKnobMods();drawModScreen();
      for(const f of WIDGETS)f();
      acc+=dt;if(DIRTY!==lastDirty){lastDirty=DIRTY;paintLCD();}
      if(acc>2&&DIRTY){acc=0;autosave();}
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
/* =========================================================
   Host bridge: active only inside the plugin window.
   UI → engine:  params (batched), graph snapshots (edit / load / rekey), store writes.
   Engine → UI:  state, slot map, host automation, transport, LFO/ENV meters.
   Standalone (no host) every function here is a no-op.
   ========================================================= */
const BRIDGE={
  meters:null,applying:false,sig:'',graphT:0,params:new Set(),paramT:0,envAcc:0,
  start(){
    if(!HOST.hosted||BRIDGE.started)return;
    BRIDGE.started=true;
    /* every patch load goes through here: the engine gets the whole snapshot once */
    const orig=loadPreset;
    loadPreset=function(pr,o={}){
      BRIDGE.applying=true;
      try{orig(pr,o);}finally{BRIDGE.applying=false;}
      BRIDGE.sendGraph(o.hostRekey?'rekey':'load');
    };
    onE('param',(k,src)=>{if(src==='load'||BRIDGE.applying)return;BRIDGE.queueParam(k);});
    for(const ev of ['graph','routes','paths'])onE(ev,()=>{if(!BRIDGE.applying)BRIDGE.scheduleGraph();});
    /* node state (slices, taps tab, IR choice) and LFO curves change without events: poll a signature */
    setInterval(()=>BRIDGE.poll(),250);
    HOST.on(m=>BRIDGE.receive(m));
    HOST.send({type:'ready'});
  },
  queueParam(k){
    BRIDGE.params.add(k);
    if(BRIDGE.paramT)return;
    BRIDGE.paramT=setTimeout(()=>{
      BRIDGE.paramT=0;
      const items=[...BRIDGE.params].filter(k=>P[k]).map(k=>[k,V(k)]);
      BRIDGE.params.clear();
      if(items.length)HOST.send({type:'params',items});
    },0);
  },
  signature(snap){
    snap=snap||snapshot();
    return JSON.stringify({n:snap.nodes.map(n=>[n.t,n.id,n.ring,n.ang,n.pair||'',n.x||null]),p:snap.paths,r:snap.routes,
      l:snap.lfo.map(L=>L&&[L.pts,L.smooth])});
  },
  scheduleGraph(){clearTimeout(BRIDGE.graphT);BRIDGE.graphT=setTimeout(()=>BRIDGE.sendGraph('edit'),40);},
  sendGraph(reason){
    clearTimeout(BRIDGE.graphT);
    /* flush pending knob moves first so the engine never sees an older value after the snapshot */
    if(BRIDGE.paramT){clearTimeout(BRIDGE.paramT);BRIDGE.paramT=0;const items=[...BRIDGE.params].filter(k=>P[k]).map(k=>[k,V(k)]);BRIDGE.params.clear();if(items.length)HOST.send({type:'params',items});}
    const snap=snapshot();
    BRIDGE.sig=BRIDGE.signature(snap);
    HOST.send({type:'graph',reason,snapshot:snap});
  },
  poll(){
    if(BRIDGE.applying)return;
    const s=BRIDGE.signature();
    if(s!==BRIDGE.sig)BRIDGE.sendGraph('edit');
  },
  applyHostState(snap,src){
    loadPreset(snap,{src:src||'user',keepMix:false,hostRekey:true});
    DIRTY=false;paintLCD();
  },
  receive(m){
    if(!m||!m.type)return;
    switch(m.type){
      case 'state':BRIDGE.applyHostState(m.snapshot,m.src);break;
      case 'slots':
        for(const [id,slot] of Object.entries(m.map||{})){
          const n=byId(id);
          if(n)n.slot=slot;else if(/^p\d+$/.test(id))S.pairSlots[id]=slot;
        }
        break;
      case 'params':
        for(const [k,v] of (m.items||[]))if(P[k])setV(k,v,'load');
        break;
      case 'transport':
        if(m.bpm)setV('g.bpm',m.bpm,'load');
        BRIDGE.playing=!!m.playing;
        break;
      case 'meters':BRIDGE.meters=m;break;
    }
  },
  /* Imported impulse: float32 channels (max 2, 15 s) as base64; returns the content key the
     snapshot stores in x.custom.key. The host writes it once to its IR folder. */
  sendImpulse(ab,name){
    const nCh=Math.min(2,ab.numberOfChannels),len=Math.min(ab.length,Math.floor(15*ab.sampleRate));
    const chans=[];let h=0x811c9dc5;
    for(let c=0;c<nCh;c++){
      const f=ab.getChannelData(c).slice(0,len),b=new Uint8Array(f.buffer);
      for(let i=0;i<b.length;i+=7){h^=b[i];h=Math.imul(h,0x01000193);}
      let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
      chans.push(btoa(s));
    }
    const key=(h>>>0).toString(16).padStart(8,'0')+'-'+len.toString(36)+'-'+nCh;
    HOST.send({type:'irImport',key,name,sr:ab.sampleRate,ch:chans});
    return key;
  },
  /* LFO and ENV displays follow the engine instead of the preview simulation */
  applyMeters(dt){
    const m=BRIDGE.meters;
    for(let i=0;i<3;i++){
      const L=MOD.lfo[i],v=m.lfo&&m.lfo[i];
      if(!v)continue;
      L.ph=v[0];L.out=v[1];MOD.val['lfo'+(i+1)]=v[1];
    }
    ENVS.lvl=m.env||0;MOD.val.env=ENVS.lvl;MOD.val.macro=V('g.macro')/100;
    BRIDGE.envAcc+=dt;
    while(BRIDGE.envAcc>1/60){BRIDGE.envAcc-=1/60;ENVS.hist.copyWithin(0,1);ENVS.hist[239]=ENVS.lvl;ENVS.inHist.copyWithin(0,1);ENVS.inHist[239]=m.envIn||0;}
  }
};
